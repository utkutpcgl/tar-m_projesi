schema_version: 1
protocol: parallel_crop_row_prior_diagnostic_v1
frozen_at: "2026-08-06T00:00:00+03:00"

data_root: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data
output_root: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/processed/audits/crop_row_prior_v1

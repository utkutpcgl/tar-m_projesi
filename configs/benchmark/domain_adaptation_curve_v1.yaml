    weight_license_status: apache_2_0_dinov2_weights
    manifest: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/processed/manifests/domain_adaptation_sorghum_n0_v1.csv
    model: {}
    training:
      dataset_weights: {phenobench: 0.20, acre: 0.20, weedsgalore: 0.05, we3ds: 0.30, rose: 0.25}

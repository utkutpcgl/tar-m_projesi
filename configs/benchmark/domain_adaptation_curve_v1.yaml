base_config: ../train/base_real_sorghum_ablation_v1.yaml
work_dir: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/runs/domain_adaptation_curve_v1
data_license_scope: research_real_equal_compute_target_domain_curve
seeds: [17]
reuse_completed: true

# Exactly equal optimizer/sample budget. Small target subsets are deliberately
# replayed more often through the domain-balanced sampler; this measures the
# value and overfit risk of N distinct target-like labeled frames.
training:
  epochs: 8
  validate_every: 8
  samples_per_epoch: 3600

# External sets are evaluated after all trainings by the paired lightweight
# semantic/pixel-safety protocol. Full native-24MP component geometry is run
# only for the control and selected winner; repeating it for every curve point
# is computationally wasteful and does not change the adaptation question.

candidates:

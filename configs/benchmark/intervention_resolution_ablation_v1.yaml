limitations:
  - Baseline 1.0x is re-run in the same process/timing protocol.
  - Interpolation adds no optical information; it only changes apparent backbone patch scale.
  - Predictions are resized back to the same native evaluation grid before all metrics.
  - The A/B must be judged jointly on small-component recall, crop errors, and latency.

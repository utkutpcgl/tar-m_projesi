claims:
  - Every model is calibrated on exactly the same three training-free spatial plots and evaluated on the same six training-free test plots.
  - The target126 arm trained on three formerly-validation plots covering all three dates; none overlaps calibration or test.
  - Source126 used microbatch four and target126 microbatch three because of shared GPU reservation; both use Ultralytics nominal nbs 64, but BatchNorm/microbatch effects make this directional rather than perfectly controlled evidence.
  - Base and source126 use 1407 source images before their extra stage; target126 additionally sees a closer plot distribution, so the experiment measures practical target adaptation rather than pure architecture.
  - The PhenoBench test was opened by earlier experiments, and the camera is UAV rather than the final robot camera; no deployment claim follows.

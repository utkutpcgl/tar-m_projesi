claims:
  - Every model is calibrated on exactly the same three training-free spatial plots and evaluated on the same six training-free test plots.
  - The target images cover three dates and overlap neither the common calibration plots nor common test plots.
  - The replay challenger changes several practical training factors together and is therefore an engineering challenger, not a one-variable causal experiment.
  - Microbatch differs across earlier arms because of shared GPU reservation; Ultralytics nominal nbs remains 64, so source126 versus target126 is directional evidence.
  - The common test was opened in earlier work and the camera is UAV rather than the final robot camera; no untouched deployment claim follows.

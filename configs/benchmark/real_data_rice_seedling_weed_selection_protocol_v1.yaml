schema_version: 1
scope: research_semantic_robustness_rice_seedling_weed_contribution
frozen_before_training: true
frozen_at: '2026-08-02T19:15:17+03:00'

control: realab_rice_control_e8_v1
screen_seed: 17
confirmation_seeds: [17, 29, 43]
fixed_epoch: 8
checkpoint: best.pt
candidate_dataset: rice_seedling_weed

evaluation_domains:
  - source
  - cwfid
  - sorghum_weed
  - cropandweed

forbidden_inputs:
  - rice_seedling_weed_train_tiles_as_post_training_evaluation
  - real_core_final_test
  - carrot_weed_external_test
  - ewis1_external_test
  - sorghum_weed_external_test

ranking:
  primary_metric: min_domain_semantic_mean_iou
  tie_breakers:
    - macro_domain_semantic_mean_iou
    - cropandweed_mean_iou
    - lower_candidate_exposure

screen_acceptance_against_control:
  primary_delta_must_be_greater_than: 0.0
  maximum_mean_iou_regression:
    source: 0.01
    cwfid: 0.01
    sorghum_weed: 0.01
    cropandweed: 0.01

confirmation_acceptance_against_control:
  mean_paired_primary_delta_must_be_greater_than: 0.0
  minimum_primary_wins_out_of_3: 2
  maximum_mean_mean_iou_regression:
    source: 0.01
    cwfid: 0.01
    sorghum_weed: 0.01
    cropandweed: 0.01

fallback_if_acceptance_fails: retain_control
external_test_used_for_selection: false
safety_policy_used_for_selection: false
spray_deployment_eligible_from_this_protocol: false

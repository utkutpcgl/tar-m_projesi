riceseg_role: >-
  Only the 2,473 quality-gated train rows from 16 source groups may be sampled
  by the challenger. GD and TKO_2 provide 604 group-disjoint development-only
  calibration rows. The 100-image reproductive diagnostic is a metadata-only
  subset of GD and is not an independent domain. No external/final test is
  created. Because RiceSEG countries enter training, this protocol makes no
  country-transfer or zero-shot claim.
early_rice_role: >-
  Rice Seedling and Weed has no held-out group and is reported only as an
  unexposed development diagnostic. It is absent from all training manifests
  and weights in this protocol.
deblurweedseg_role: >-
  The single-field sharp/motion-blur pair is reported for visibility only. It
  cannot accept, reject, or rank the candidate.


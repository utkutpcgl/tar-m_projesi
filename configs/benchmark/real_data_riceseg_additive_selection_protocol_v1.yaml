  accepted and matched-compute controls, freeze a paired seed 17/29/43 matrix
  before training seed 29/43. Reuse seed-17 and compatible evaluation
  artifacts byte-for-byte. The matched-compute arm is causal evidence only
  and is never selection eligible.


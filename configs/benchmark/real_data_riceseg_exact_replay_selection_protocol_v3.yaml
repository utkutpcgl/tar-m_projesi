followup_rationale: >-
  The frozen 4.7619% and 2.38095% additive screens learned RiceSEG and its
  reproductive subset strongly but failed the unchanged accepted-control
  CWFID gate. Code and deterministic stream audit show that the sampler was
  already uniform over RiceSEG field/session groups, so row-count balancing
  is not a justified follow-up. The same audit also shows those screens
  preserved expected old-data volume rather than the actual accepted sample
  stream: only 162/28,778 and 352/28,800 filtered old positions matched.
  This one permitted follow-up fixes compute at 3,600 draws and replaces
  exactly 90 evenly spaced accepted-stream indices per epoch. The other
  3,510 indices are identical in position. No acceptance threshold changes.


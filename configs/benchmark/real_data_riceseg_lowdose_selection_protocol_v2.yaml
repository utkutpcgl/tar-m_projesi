followup_rationale: >-
  The frozen v1 4.7619% replay-preserving arm produced very large RiceSEG,
  reproductive, early-rice, expanded-robust, and macro gains, but exceeded
  the unchanged 0.01 per-domain limit on CWFID and Sorghum. This one permitted
  follow-up halves RiceSEG exposure before training and retains the same
  3,780-example compute control. No threshold is relaxed.
compute_budget:
  epochs: 8
  accepted_control_sampled_examples: 28800
  matched_compute_and_candidate_sampled_examples: 30240
  candidate_expected_riceseg_draws_per_epoch: 90
  candidate_expected_old_draws_per_epoch: 3690
  matched_compute_expected_old_draws_per_epoch: 3780
  note: >-
    Unlike v1, this low-dose arm is not exact expected-draw replay of the
    3,600-example accepted control; it adds 90 old and 90 RiceSEG draws. It
    must therefore pass against both the accepted control and the byte-reused
    equal-compute control. The causal effect of RiceSEG at fixed 3,780 compute
    is the comparison with the latter.


tobacco_role: >-
  Campaigns 2, 3, 5, 6, 7, and 8 are training-only. Campaigns 1 and 4 are
  fixed development-only external calibration and are never sampled by any
  arm. The field/campaign split is group-disjoint, but this is not an untouched
  external test. A content-independent balanced subset caps every campaign at
  120 patches and retains complete 12-patch parent blocks.
tobacco_release_anomaly: >-
  Campaign 1's separately bundled 1080p images do not correspond to its patch
  tree. Its Patch images/data and mask trees are authoritative because the two
  nested releases are byte-identical and their consecutive 12-patch blocks are
  spatially coherent. Campaign 1's 1080p files are quarantined from conversion,
  supervision, and evaluation.
real_rice_role: >-
  Unexposed real-domain development diagnostic. Its upstream split is named
  train, but no Rice tile is present in any arm's manifest or sampling weights.
weedmap_role: >-
  Unexposed development-only calibration diagnostic. No WeedMap tile is
  present in any arm's manifest or sampling weights.
deblurweedseg_role: >-
  Single-field matched sharp/motion-blur development diagnostic. It is reported
  for visibility only and cannot accept, reject, or rank a candidate.

ranking:
  primary: min_eight_domain_semantic_mean_iou

weedmap_role: >-
  Maps 000, 001, 002, and 004 are training-only. Map 003 is a fixed
  development-only external-calibration group and is never sampled by any arm.
  All five RGB orthomosaics come from one Rheinbach field and one 2017-09-18
  campaign, so the groups are spatially correlated and do not constitute five
  independent sites.
real_rice_role: >-
  Unexposed real-domain development diagnostic. Its upstream split is named
  train, but no Rice tile is present in any training manifest or weight map.
deblurweedseg_role: >-
  Single-field matched sharp/motion-blur development diagnostic. It is reported
  for visibility only and cannot accept, reject, or rank a candidate.


base_config: ../train/base_real_final.yaml
work_dir: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/runs/real_final_diagnostic_multiseed_v1
data_license_scope: research_only_includes_nc_and_odbl_review_data
seeds: [17, 29, 43]
reuse_completed: true

training:
  epochs: 15
  validate_every: 5
  samples_per_epoch: 3600
  warmup_steps: 200

development_evaluations:
  - name: cwfid
    manifest: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/processed/manifests/cwfid.csv
    data_root: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data
    split: external_calibration
    batch_size: 1
    workers: 4

# The screen's primary robustness metrics collapsed to zero for every candidate.
# These are therefore complementary diagnostic continuations, not a post-hoc
# declaration of a deployment winner: DINOv2 led source segmentation quality;
# flat/frozen ConvNeXt was the highest-ranked calibrated run and retained a
# small non-zero CWFID safe-weed recall while satisfying all three risk gates.
candidates:
  - name: rf3_dinov2_small_frozen_mean1_drop05_multiseed
    weight_license_status: apache_2_0_model_card
    model:
      architecture: dinov2_small_fpn
      trainable: frozen
      head: factorized
      conditioning_dropout: 0.50
    training:
      learning_rate: 0.0003
      batch_size: 4
      gradient_accumulation: 4
    loss:
      crop_safety_weight: 1.0
      crop_safety_tail_fraction: 1.0

  - name: rf3_convnext_flat_frozen_mean1_multiseed
    weight_license_status: review_imagenet_pretraining_terms
    model:
      architecture: convnext_tiny_fpn
      trainable: frozen
      head: flat
    training:
      learning_rate: 0.0003
      batch_size: 8
      gradient_accumulation: 2
    loss:
      crop_safety_weight: 1.0
      crop_safety_tail_fraction: 1.0

base_config: ../train/base_real.yaml
work_dir: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/runs/screening_research_max
data_license_scope: research_only_includes_cc_by_nc_sa
seeds: [17]
reuse_completed: false

training:
  epochs: 8
  validate_every: 4
  samples_per_epoch: 1600
  warmup_steps: 100

development_evaluations:
  - name: cwfid
    manifest: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/processed/manifests/cwfid.csv
    data_root: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data
    split: external_calibration
    batch_size: 1
    workers: 4

candidates:
  - name: deeplabv3_resnet50
    weight_license_status: review_imagenet_pretraining_terms
    model:
      architecture: deeplabv3_resnet50
      trainable: all
      head: flat
    training:
      learning_rate: 0.0001
      batch_size: 6
      gradient_accumulation: 2

  - name: segformer_b2
    weight_license_status: noncommercial_nvidia_source_code_license
    model:
      architecture: segformer_b2
      trainable: all
      head: flat
    training:
      learning_rate: 0.00006
      batch_size: 4
      gradient_accumulation: 4

  - name: convnext_tiny_flat_frozen
    weight_license_status: review_imagenet_pretraining_terms
    model:
      architecture: convnext_tiny_fpn
      trainable: frozen
      head: flat
    training:
      learning_rate: 0.0003

  - name: convnext_tiny_factorized_frozen
    weight_license_status: review_imagenet_pretraining_terms
    model:
      architecture: convnext_tiny_fpn
      trainable: frozen
      head: factorized
    training:
      learning_rate: 0.0003

  - name: convnext_tiny_factorized_stage4
    weight_license_status: review_imagenet_pretraining_terms
    model:
      architecture: convnext_tiny_fpn
      trainable: stage4
      head: factorized
    training:
      learning_rate: 0.0002
      backbone_lr_multiplier: 0.1
      batch_size: 6
      gradient_accumulation: 2

  - name: dinov2_small_factorized_frozen
    weight_license_status: apache_2_0_model_card
    model:
      architecture: dinov2_small_fpn
      trainable: frozen
      head: factorized
    training:
      learning_rate: 0.0003
      batch_size: 4
      gradient_accumulation: 4

schema_version: 1
scope: research_semantic_crop_segmentation
frozen_before_challenger_training: true
frozen_at_utc: '2026-08-02T14:45:00+03:00'

paired_candidates:
  control: simab_real_sorghum_cropcraft_agri10_e8_v2
  challenger: simab_real_sorghum_cropcraft_robust10_e8_v3
seeds: [17, 29, 43]
fixed_epoch: 8
checkpoint: last.pt

development_inputs:
  - source_real_validation
  - cwfid_external_calibration
  - sorghum_weed_external_calibration
locked_external_test:
  historical_manifest: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/processed/manifests/sorghum_weed.csv
  historical_split: external_test
  status: historically_consumed_and_forbidden_for_this_selection
  may_be_read_only_after_selection_receipt: false
  required_next_step: collect_or_register_a_new_untouched_multi_field_test

primary_metric:
  name: per_seed_robust_semantic_mean_iou
  definition: >-
    min(source_real_validation_mean_iou, cwfid_mean_iou,
    sorghum_weed_mean_iou)

challenger_acceptance:
  mean_paired_primary_delta_must_be_greater_than: 0.0
  minimum_primary_wins_out_of_3: 2
  maximum_allowed_mean_source_validation_miou_regression: 0.01
  maximum_allowed_mean_sorghum_validation_miou_regression: 0.01

fallback_if_acceptance_fails: retain_v2_custom_asset_control
representative_checkpoint_rule: median_seed_by_primary_metric_with_seed_as_tie_breaker
external_test_used_for_selection: false
safety_policy_used_for_selection: false
spray_deployment_eligible_from_this_protocol: false
receipt_selection_status: >-
  asset_pack_selected_or_rejected_on_real_development_only;
  new_untouched_multi_field_test_required

  minimum_robust_wins_out_of_3: 2
  mean_riceseg_delta_must_be_at_least: 0.005
  mean_riceseg_reproductive_delta_must_be_at_least: 0.010
  maximum_mean_existing_domain_mean_iou_regression:
    source: 0.010
    cwfid: 0.010
    sorghum_weed: 0.010
    cropandweed: 0.010
    early_rice: 0.010


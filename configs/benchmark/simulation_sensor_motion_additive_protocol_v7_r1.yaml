  architecture_loss_optimizer_and_hyperparameters_identical: true
  note: >-
    Scaling every old weight by 40/41 preserves 3,600 old draws only in
    expectation; it does not replay the accepted arm's exact old-sample
    sequence. Therefore the equal-compute old-data arm is required.

existing_domains:
  - source
  - cwfid
  - sorghum_weed
  - cropandweed
  - rice
  - growingsoy
  - weedmap
  - tobacco
sensor_asset_calibration_role: >-
  Forty generated frames from source scenes 20-24 are used only for static
  asset/QC review. They are excluded from all training arms and are not used to
  accept, reject, or rank a model.
deblurweedseg_role: >-
  One fixed field of 100 sharp/motion-blur matched pairs is a development-only
  nuisance diagnostic. No real DeBlurWeedSeg image, mask, kernel, cutout, or
  fitted parameter enters the asset builder or training. The motion-blur half
  is the screen target; its sharp half is a non-inferiority guard. Neither is an
  untouched external test.
other_real_domain_role: >-
  CWFID, Sorghum, CropAndWeed, Rice, GrowingSoy, WeedMap, and Tobacco are fixed
  unexposed development guards. No tile from these evaluation roles appears in
  any arm's manifest or sampling weights.

ranking:
  primary: min_nine_domain_semantic_mean_iou_including_motion_blur
  tie_breakers:
    - deblur_motion_blur_semantic_mean_iou
    - macro_nine_domain_semantic_mean_iou

screen_acceptance_against_each_control:
  motion_blur_mean_iou_delta_must_be_at_least: 0.01
  maximum_deblur_sharp_mean_iou_regression: 0.01
  existing_robust_delta_must_be_at_least: 0.0
  expanded_robust_delta_must_be_at_least: 0.0
  existing_macro_delta_must_be_at_least: 0.0
  expanded_macro_delta_must_be_at_least: 0.0
  maximum_existing_domain_mean_iou_regression:

    Two accepted-control reuse preflights stopped before producing a decision
    receipt. The prior WeedMap artifact selected external_calibration from the
    full manifest while the protocol locked its projection; the prior Tobacco
    artifact used the projection while the protocol locked the full manifest.
  equivalence_proof: >-
    Selecting split=external_calibration from the 519-row weedmap.csv yields 95
    SampleRecord objects in exactly the same order and with every field equal
    to weedmap_calibration_v1.csv. Selecting the same role from the 960-row
    tobacco_aerial_balanced_v1.csv likewise yields 240 records exactly equal
    and in the same order as tobacco_aerial_balanced_calibration_v1.csv.
  administrative_change: >-
    Lock weedmap.csv (SHA-256 fd8d01...) so the previously computed artifact can
    be reused byte-for-byte, and lock the Tobacco calibration-only projection
    (SHA-256 ee7f4c...). No evaluated row, role, model, checkpoint, threshold,
    acceptance rule, or training input changed. No fresh model-gate domain
    metric had completed and no selection receipt existed when amended.


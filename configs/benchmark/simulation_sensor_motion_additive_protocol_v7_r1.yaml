  minimum_expanded_robust_wins_out_of_3: 2
  mean_motion_blur_delta_must_be_at_least: 0.01
  maximum_mean_deblur_sharp_regression: 0.01
  mean_existing_macro_delta_must_be_at_least: 0.0
  mean_expanded_macro_delta_must_be_at_least: 0.0
  maximum_mean_existing_domain_mean_iou_regression:
    source: 0.01
    cwfid: 0.01
    sorghum_weed: 0.01
    cropandweed: 0.01
    rice: 0.01
    growingsoy: 0.01
    weedmap: 0.01
    tobacco: 0.01

confirmation_matrix_policy: >-
  If and only if the seed-17 challenger passes every rule against both
  controls, stop and freeze a paired candidate/accepted matrix at seeds
  17/29/43 before training seed 29 or 43. Reuse compatible accepted-control and
  seed-17 artifacts byte-for-byte. The matched-compute control is causal
  evidence only and is never selection eligible.


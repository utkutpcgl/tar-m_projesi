hypothesis:
  measured_gap: >-
    On the fixed matched DeBlurWeedSeg development pairs, the accepted seed-17
    checkpoint loses 0.1777285 mean IoU from sharp to motion blur. Its training
    transform includes occasional isotropic Gaussian blur but no directional
    exposure trajectory.
  isolated_change: >-
    Add normalized linear/curved camera-shake PSF renders of accepted dryland
    and paddy synthetic RGBs while reusing the exact latent scene masks. Do not
    change model capacity, loss, optimizer, botanical geometry, soil, or HDRI.
  causal_limit: >-
    The real blur diagnostic is one field and development-only. It can screen a
    concrete sensor hypothesis but cannot support a general field or deployment
    claim. A matched-compute old-data arm controls the extra 90 draws per epoch.


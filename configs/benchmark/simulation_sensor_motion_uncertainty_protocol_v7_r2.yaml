hypothesis:
  r1_target_evidence: >-
    V7-R1 raised real single-field motion-blur mean IoU by 0.064939 versus
    accepted and 0.069539 versus equal-compute, proving that directional PSF
    RGBs address a measured sensor gap.
  r1_robustness_failure: >-
    At 90 motion draws per 3,690-sample epoch with unchanged hard latent masks,
    R1 reduced CWFID by 0.052882/0.025866 and existing robust by
    0.013881/0.016959. It was correctly rejected.
  r2_isolated_data_fix: >-
    Reuse R1 RGB/PSF bytes. Change only exposure-ambiguous original-class
    boundary pixels to ignore at the frozen majority threshold 0.50, and lower
    motion sampling to 22.5 expected draws per 3,600-sample epoch. Do not add
    compute, architecture, loss, optimizer, botanical, soil, or HDRI changes.
  expected_total_motion_draws: 180
  expected_asset_passes_over_8_epochs: 1.125
  causal_limit: >-
    This is a combined label-quality and dose refinement motivated by the
    already rejected R1. It does not separately identify their individual
    effects. The target real blur evidence remains single-field development.


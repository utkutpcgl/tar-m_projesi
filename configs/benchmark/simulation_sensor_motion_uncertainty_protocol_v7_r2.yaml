sensor_asset_calibration_role: >-
  Forty V7-R2 frames from source scenes 20-24 are static/manual asset-QC only.
  They are excluded from training, evaluation, acceptance, rejection, and
  ranking. Their masks do not tune the 0.50 threshold; that threshold was
  selected from a synthetic-only all-mask retention scan before R2 build.
deblurweedseg_role: >-
  The same fixed 100 sharp/100 motion-blur single-field matched pairs are a
  development-only target/guard. No real DeBlurWeedSeg input enters assets or
  training. This is not an external-test or broad camera claim.
other_real_domain_role: >-
  CWFID, Sorghum, CropAndWeed, Rice, GrowingSoy, WeedMap, and Tobacco are fixed
  unexposed development guards. No tile is present in the candidate manifest
  or sampling weights.


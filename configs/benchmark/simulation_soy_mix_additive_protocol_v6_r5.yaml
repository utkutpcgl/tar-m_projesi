  equal_mix_mean_weed_fraction: 0.03053770065307617
  isolated_change: split_same_90_soy_draws_equally_between_dense_v5_and_stress_v6
  rationale: >-
    Preserve every accepted source's absolute 3,600-example draw count and the
    previous additive screen's total 90-draw soybean budget. Change only the
    soybean scene-composition mixture, then compare against both the original
    control and the already-completed 3,690-example compute control.
  explicitly_unchanged:

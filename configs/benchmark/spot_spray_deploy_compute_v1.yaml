imaging_contract:
  raw_sensor_width_px: 2048
  raw_sensor_height_px: 2048
  field_width_mm: 500.0
  field_height_mm: 500.0
  tile_size_px: 1024
  tile_halo_px: 0
  tile_rows: 2
  tile_columns: 2
  minimum_actionable_weed_diameter_mm: 10.0
  primary_actionable_weed_diameter_mm: 20.0
  maximum_blur_px: 0.75
  travel_speeds_m_s: [0.5, 1.0]
  minimum_track_observations: 3

inference:
  image_size: 1024
  batch_sizes: [1, 4]
  warmup_iterations: 8
  measured_iterations: 30
  device: 0
  half: true
  confidence: 0.25
  iou: 0.7
  max_detections: 600

outputs:
  full_report: processed/audits/spot_spray_deploy_compute_v1/compute_benchmark.json
  repository_summary: docs/results/spot_spray_deploy_compute_summary_v1.json

claims:
  - The geometry is a design target, not a measurement of purchased hardware.
  - The timing includes model preprocessing, forward pass, NMS, mask construction, and result transfer for preloaded real frames.
  - Camera acquisition, tracking, actuator latency, and spray physics are outside this compute-only gate.
  - Model accuracy on PhenoBench does not prove accuracy in the future deployment field.

pixel_space:
  pixel_space_id: native_2048_square_zero_based_pixel_centres_v1
  preprocessing_sha256: 7c390a8f432fab596ba7accfb135b3d93002eda91efe78bac9e7f1c038307f45
  width_px: 2048
  height_px: 2048
  pixel_centres: [column_plus_0p5, row_plus_0p5]
  central_support_xyxy_px: [64.0, 64.0, 1984.0, 1984.0]
  implicit_resize_allowed: false
  implicit_crop_allowed: false
  runtime_undistortion_allowed: false

coordinate_contract:
  product_ground_axes:
    x: forward_travel
    y: vehicle_right
  homography_direction: image_pixel_to_camera_local_ground_mm
  runtime_matrix_inversion_allowed: false
  encoder_positive_axis: product_ground_positive_x
  odometric_anchor_formula:
    x: camera_local_ground_x_mm_plus_relative_encoder_travel_mm
    y: camera_local_ground_y_mm
  quantization_um: 10
  quantization_rounding: round_half_even
  projection_denominator_absolute_minimum: 1.0e-9
  opposite_sign_role: diagnostic_negative_control_only

homography_acceptance:
  residual_p95_maximum_mm: 1.0
  residual_maximum_mm: 2.0
  daily_registration_drift_maximum_mm: 2.0
  orientation_witness_maximum_error_mm: 2.0
  orientation_minimum_axis_delta_mm: 1.0
  required_orientation_witness_roles: [origin, forward, right]
  support_polygon_required: true
  stable_binding_within_video: true

encoder_and_timing:
  source: trigger_latched_signed_ground_contact_quadrature_encoder
  encoder_position_unit: integer_micrometres
  same_hardware_event_required: true
  encoder_resolution_maximum_um_per_count: 1000
  encoder_scale_error_maximum_um_per_m: 1000
  trigger_encoder_delta_maximum_us: 250
  encoder_stale_no_fire_after_us: 5000
  maximum_forward_speed_um_s: 1000000
  travel_envelope_endpoint_tolerance_um: 2000
  frame_rate_hz: 15
  timestamp_strictly_increasing: true
  frame_indices_strictly_consecutive: true
  reverse_or_ambiguous_direction_allowed: false

detection_anchor:
  source: arithmetic_mean_of_canonical_mask_foreground_pixel_centres
  canonical_mask_required: true
  mask_hash: sha256_shape_plus_big_endian_packbits
  association_key: [anchor_x_um, anchor_y_um, canonical_mask_sha256]
  duplicate_geometry_in_one_frame: terminal_invalid_sequence
  bbox_used: false
  action_point_used: false
  class_used: false
  confidence_used: false

association:
  objective:
    - maximum_cardinality
    - minimum_total_integer_squared_residual_um2
    - lexicographically_smallest_assignment_vector
  solver: deterministic_exact_integer_min_cost_flow
  residual_metric: euclidean_ground_distance
  maximum_frame_index_delta: 2
  bridges_intervening_no_detection_frames: 1
  hard_gate_ceiling_um: 45000
  fixed_budget_um: 8500
  fixed_budget_terms_um:
    two_homography_observations: 4000
    daily_registration_drift: 2000
    two_encoder_quantization_endpoints: 2000
    two_trigger_latch_endpoints_at_maximum_speed: 500
  dynamic_gate:
    maximum_canopy_relief_mm: 110
    minimum_camera_ground_distance_mm: 520
    parallax_formula: ceil_travel_um_times_110_divided_by_410
    scale_formula: ceil_travel_um_divided_by_1000
    final_rounding: ceil_to_next_1000_um
  acceptance_vectors_um:
    speed_0p5_one_frame: 18000
    speed_0p5_two_frames: 27000
    speed_1p0_one_frame: 27000
    speed_1p0_two_frames: 45000
  raw_pixel_fallback_allowed: false
  appearance_or_flow_fallback_allowed: false
  interpolation_allowed: false
  filtering_or_target_velocity_model_allowed: false
  maximum_track_id: 999999

association_input_policy:
  exact_allowed_detection_fields: [mask, class_name, confidence, polygon, action_point]
  exact_allowed_frame_fields: [frame_id, frame_index, timestamp_ns, encoder_position_um, trigger_encoder_delta_us, encoder_age_us, homography_binding_id, detections]
  forbidden_exact_fields:
    - source_object_id
    - stable_gt_track_id
    - pair_id
    - arm
    - condition
    - split
    - renderer_trajectory
    - latent_trajectory
    - predicted_track_id
    - previous_predicted_track_id
  forbidden_prefixes: [gt_]

class_output:
  allowed_classes: [crop, weed, partial_unknown]
  track_class: immutable_birth_observation_class
  association_completed_before_class_logic: true
  conflict_track_identity_preserved: true
  conflict_emitted_confidence: 0.0
  conflict_recorded_in_sidecar: true
  promotion_to_weed_from_later_observation_allowed: false
  weed_only_output_field: action_point

track_identity:
  format: trk_000001
  scope: explicit_single_video_lifecycle_only
  first_numeric_id: 1
  reset_at_every_explicit_video_start: true
  input_frame_id_parsed_for_identity: false
  cross_video_state_allowed: false

state_machine:
  states: [UNINITIALIZED, ACTIVE, INVALID_SEQUENCE, FINALIZED]
  atomic_video_publication: true
  partial_prediction_publication_allowed: false
  recovery_inside_invalid_video_allowed: false
  explicit_reset_required_between_videos: true
  no_detection_frame_is_valid: true
  terminal_fault_discards_buffered_prediction: true

terminal_failure_codes:
  - INVALID_CONFIG_OR_SOURCE_LOCK
  - INVALID_HOMOGRAPHY_BINDING
  - INVALID_PIXEL_SPACE
  - INVALID_ENCODER_BINDING
  - INVALID_FRAME_ORDER
  - INVALID_TIMESTAMP
  - MISSING_ENCODER
  - STALE_ENCODER
  - UNSYNCHRONIZED_ENCODER
  - REVERSE_OR_AMBIGUOUS_DIRECTION
  - TRAVEL_OUTSIDE_PROOF_ENVELOPE
  - HOMOGRAPHY_BINDING_DRIFT
  - INVALID_DETECTION_GEOMETRY
  - AMBIGUOUS_DUPLICATE_GEOMETRY
  - FORBIDDEN_ASSOCIATION_INPUT
  - TRACK_ID_OVERFLOW
  - INVALID_STATE

output_contract:
  prediction_frame_fields: [record_type, frame_id, candidates]
  prediction_record_type: frame_prediction
  candidate_fields: [predicted_track_id, class_name, confidence, polygon]
  weed_only_candidate_fields: [action_point]
  diagnostic_sidecar_is_separate: true
  tracker_performs_fire_once: false
  tracker_performs_duplicate_repair: false
  tracker_performs_gt_matching: false

calibration_diagnostic:
  role: neutral_geometry_mechanics_only
  required_speed_m_s: [0.5, 1.0]
  required_frames_per_speed: 30
  minimum_persistent_fiducials: 9
  raw_pixel_ceiling_witness_px: 160.0
  positive_sign_gate_violations_required: 0
  wrong_sign_gate_violation_minimum: 1
  target_gt_allowed: false
  model_output_allowed: false
  locked_test_allowed: false
  outcome_targets_allowed: false
  full_render_write_allowed: false


class_contract:
  checkpoint_and_prediction_names:
    0: weed
    1: crop
  ground_truth_semantic_ids:
    background: 0
    crop: 1
    weed: 2

locked_policy:
  weed_confidence_threshold: 0.80
  crop_confidence_threshold: 0.25
  association_min_mask_iou: 0.10
  association_max_centroid_distance_px: 160.0
  maximum_frame_gap: 2
  eligible_track_match_iou: 0.50
  minimum_track_observations: 3

descriptive_diagnostics:
  purpose: failure_decomposition_only_never_selection_or_acceptance
  threshold_values: [0.05, 0.10, 0.25, 0.50, 0.80, 0.95]
  association_min_mask_iou_values: [0.05, 0.10, 0.25]
  # Extends beyond the observed test-weed p95 (~455 px) and maximum (~459 px)
  # solely to separate a geometry ceiling from class/localization failure.
  association_max_centroid_distance_px_values: [80.0, 160.0, 240.0, 320.0, 480.0, 640.0]
  maximum_frame_gap_values: [1, 2, 3]
  contact_sheet_frame_indices: [10, 13, 15, 18, 29]
  contact_sheet_panel_px: 360

acceptance_rule:
  target_metric: eligible_weed_mask_track_spatiotemporal_iou_f1
  ideal_minimum: 0.97
  degraded_interval: [0.70, 0.80]
  undefined_f1_fails_target_gate: true
  require_fresh_untouched_full_locked_test_after_any_correction: true
  require_degraded_calibration_only_threshold_lock: true
  require_exactly_one_locked_test_evaluation: true
  require_hash_and_class_contract_validation: true
  synthetic_results_authorize_field_or_chemical_action: false

outputs:
  run_root: data/runs/spot_spray_native_fixture_fairness_audit_v1

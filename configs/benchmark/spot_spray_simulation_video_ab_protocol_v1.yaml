claim_boundary:
  simulation_is_physical_acceptance: false
  simulation_is_field_proof: false
  simulation_is_product_proof: false
  synthetic_pseudo_fields_are_real_fields: false
  controlled_capture_authorized: false
  dry_marker_ready: false
  field_go: false
  product_go: false
  chemical_fire_allowed: false
  deposition_or_crop_injury_proven: false
  purchase_or_fabrication_authorized: false
  synthetic_score_weight_in_real_go_decision: 0.0
  permitted_terminal_statuses:
    - SIM_AB_COMPLETE_SYNTHETIC_ONLY
    - SIM_AB_CALIBRATION_INFEASIBLE_SYNTHETIC_ONLY
    - SIM_AB_INVALID_FAIL_CLOSED
    - REPLAN_REQUIRED

registered_hypotheses:
  role: descriptive_references_only
  registered_before_render_or_inference: true
  acceptance_band: null
  acceptance_gate: false
  influences_sample_size: false
  influences_seed_derivation: false
  influences_candidate_selection: false
  influences_capture_envelopes: false
  influences_threshold_selection: false
  influences_tracker_or_model: false
  locked_test_action_f1:
    ideal_reference: 0.97
    degraded_reference: 0.75
    reporting: observed_value_observed_minus_reference_and_interval
  forbidden_uses:
    - tune_degradation_to_reference
    - simplify_ideal_to_reference
    - choose_or_replace_pairs_from_model_outcomes
    - extend_sample_size_after_results
    - define_near_band_after_results

pairing_contract:
  experimental_unit: complete_latent_video_sequence
  pair_id_equals_latent_id: true
  arms: [ideal, degraded]
  exact_arms_per_pair: 2
  frames_are_independent_units: false
  common_random_numbers_across_arms: true
  canonical_identity:
    format: canonical_utf8_json
    sorted_keys_recursive: true
    compact_separators: true
    forbid_nan_or_infinity: true
    decimal_encoding: canonical_decimal_strings
    identity_files_final_newline: true
    forbidden_fields: [timestamp_created, absolute_path, random_uuid, hostname]
  required_shared_fields:
    - pair_id
    - latent_frame_ids
    - source_scene_graph_identity
    - source_asset_identities
    - crop_and_weed_source_object_ids
    - object_geometry_material_pose_and_world_transforms
    - ground_tillage_environment_and_ambient_state
    - camera_mid_exposure_trajectory
    - encoder_trajectory
    - frame_clock
    - frame_count
    - gt_classes_instances_tracks_polygons_and_masks
    - canopy_span_mm
    - visible_fraction
    - partial_and_occluded_flags
    - split_and_synthetic_grouping
    - base_capture_draw_vector
  allowed_arm_differences:
    - capture_profile_id
    - arm_prefixed_frame_and_video_ids
    - temporal_integration_enabled
    - pulse_width_us
    - psf_path_family_and_weights
    - artificial_light_energy_size_and_warmth
    - resulting_rgb_pixels_and_hashes
  forbidden_arm_differences:
    - latent_scene_or_trajectory
    - timestamp_or_encoder
    - camera_mid_exposure_pose
    - source_object_or_gt_track_identity
    - gt_geometry_or_action_eligibility_fields
    - model_checkpoint
    - inference_or_tracker_configuration
    - metric_or_threshold_policy
  mismatch_disposition: invalidate_full_release_never_drop_pair

seed_derivation:
  algorithm: sha256_uint64_big_endian_first_8_bytes
  input_order:
    - protocol_id
    - split
    - cell_id
    - replicate_index
    - candidate_index
    - channel_name
    - v12_split_base_seed
  separator: "|"
  split_base_seeds:
    calibration: 440000
    locked_test: 540000
  channels:
    - scene_seed
    - trajectory_seed
    - capture_draw_seed
    - renderer_seed
    - audit_sample_seed
  candidate_index_range: [0, 9]
  exact_attempts_per_required_slot_maximum: 10
  raw_seed_reuse_across_split_or_channel_allowed: false
  arm_specific_seed_channels_allowed: false
  outcome_inputs_forbidden:
    - model_confidence
    - predicted_mask
    - predicted_track
    - segmentation_metric
    - tracking_metric
    - action_metric
    - ideal_reference
    - degraded_reference

allocation:
  factors:
    travel_speed_m_s: [0.5, 1.0]
    v12_scene_profile: [hood_dry_nominal, hood_moist_glare_challenge]
    degraded_motion_path: [linear, smooth_curved]
  exact_cell_count: 8
  ideal_arm_retains_degraded_motion_path_stratum_for_pairing: true
  splits:
    calibration:
      evaluator_split: validation
      v12_source_role: val
      replicates_per_cell: 4
      pair_count: 32
      arm_count: 64
      frames_per_arm: 30
      rendered_frame_count: 1920
    locked_test:
      evaluator_split: test
      v12_source_role: test
      replicates_per_cell: 8
      pair_count: 64
      arm_count: 128
      frames_per_arm: 30
      rendered_frame_count: 3840
  totals:
    pair_count: 96
    video_count: 192
    frames_per_video: 30
    rendered_frame_count: 5760
  counts_frozen_before_outcomes: true
  post_result_extension_allowed: false

shared_latent_envelope:
  native_raster_px: [2048, 2048]
  frame_rate_hz: 15
  frame_count: 30
  frame_indices: [0, 29]
  duration_s: 2.0
  timestamp_ns_formula: round_frame_index_times_1000000000_over_15
  encoder_formula: exact_signed_speed_times_timestamp_then_canonical_decimal_mm
  ground_fov_mm: [474.0, 484.0]
  working_distance_mm: [550.0, 590.0]
  roll_deg: [-1.0, 1.0]
  pitch_deg: [-1.0, 1.0]
  yaw_deg: [-4.0, 4.0]
  lateral_camera_offset_m: [0.01, 0.10]
  focus_reference_plane_above_ground_mm: 55.0
  test_planes_above_ground_mm: [0.0, 55.0, 110.0]
  outer_abstain_ring_px: 64
  central_action_region_px: [1920, 1920]
  exposure_metadata_us: 170.0
  shutter: global
  travel_speeds_m_s: [0.5, 1.0]
  continuous_parameter_design:
    method: deterministic_latin_hypercube_stratum_midpoints
    calibration_strata_per_cell: 4
    locked_test_strata_per_cell: 8
    deterministic_per_variable_permutation: true
    post_outcome_reallocation_allowed: false
  minimum_scene_strip_guard_mm: 100.0
  reverse_motion_allowed: false
  frame_drops_allowed: false
  scene_profiles:
    hood_dry_nominal:
      environment_strength: [0.03, 0.07]
      soil_moisture: [0.08, 0.35]
      sun_energy: [0.00, 0.03]
      sun_elevation_deg: [30.0, 68.0]
      sun_angle_deg: [8.0, 12.0]
      local_shadow_fraction: [0.00, 0.04]
      artificial_light_energy_renderer_units: [35.0, 55.0]
      artificial_light_size_m: [0.50, 0.72]
      artificial_light_warmth_proxy: [0.30, 0.52]
    hood_moist_glare_challenge:
      environment_strength: [0.05, 0.09]
      soil_moisture: [0.38, 0.78]
      sun_energy: [0.02, 0.05]
      sun_elevation_deg: [15.0, 55.0]
      sun_angle_deg: [7.0, 12.0]
      local_shadow_fraction: [0.02, 0.08]
      artificial_light_energy_renderer_units: [30.0, 48.0]
      artificial_light_size_m: [0.58, 0.80]
      artificial_light_warmth_proxy: [0.40, 0.70]
  artificial_light_is_physical_radiometry: false

ideal_capture_profile:
  profile_id: IDEAL_CAPTURE_UPPER_BOUND_V1
  role: idealized_optical_upper_bound_proxy
  exposure_sampling: one_point_at_shared_mid_exposure_pose
  temporal_integration: false
  motion_psf: none
  light_quadrants: four_equal_all_on
  profile_midpoint_light:
    hood_dry_nominal:
      energy_renderer_units: 45.0
      size_m: 0.61
      warmth_proxy: 0.41
    hood_moist_glare_challenge:
      energy_renderer_units: 39.0
      size_m: 0.69
      warmth_proxy: 0.55
  white_balance: fixed_neutral_proxy
  gain_db: 0.0
  tone_mapping: deterministic_common_with_degraded
  output: lossless_rgb8_srgb_png_proxy
  absent_effects:
    - sensor_noise
    - compression
    - contamination
    - defocus_perturbation
    - chromatic_aberration
    - vignetting_perturbation
    - dropped_frame
    - rolling_shutter
  retains_scene_occlusion_and_domain_limitations: true
  achievable_installed_capture_claim: false

degraded_capture_profile:
  profile_id: DEGRADED_CAPTURE_PROXY_V1
  role: bounded_realistic_directional_capture_proxy
  temporal_integration: global_shutter_light_pulse
  pulse_width_us: [150.0, 170.0]
  light_sampling: frozen_latin_hypercube_within_shared_profile_ranges
  motion_path_families: [linear, smooth_curved]
  dominant_direction: projected_forward_camera_travel
  gsd_formula: ground_fov_mm_divided_by_2048
  blur_formula: speed_m_s_times_pulse_width_us_times_0p001_divided_by_gsd_mm_per_px
  maximum_total_psf_path_px: 0.75
  psf_sum_target: 1.0
  psf_sum_absolute_tolerance: 1.0e-6
  maximum_psf_centroid_error_px: 0.15
  curved_path_source: pinned_v7_curve_generator_rescaled_to_physical_length
  convolution_border: reflect_101
  v7_original_kernel_lengths_px_allowed: false
  v7_original_kernel_range_px: [5, 25]
  random_zero_to_180_degree_angle_allowed: false
  extra_gaussian_blur_allowed: false
  post_outcome_rescaling_allowed: false
  output: lossless_rgb8_srgb_png_proxy
  unmodelled_effects:
    - sensor_noise_and_bayer_response
    - lens_mtf_and_chromatic_aberration
    - installed_light_uniformity
    - contamination_or_fogging
    - defocus
    - severe_vibration
    - dropped_frames
    - compression
    - light_channel_failure
  absolute_camera_realism_claim: false

preoutcome_gates:
  candidate_selection:
    policy: first_candidate_in_derived_order_passing_all_non_model_gates
    maximum_attempts_per_slot: 10
    rejection_ledger_required: true
    rejected_candidate_reuse_allowed: false
    model_access_before_acceptance: false
    human_preference_between_passing_candidates: false
    permitted_inputs:
      - source_and_asset_provenance
      - geometry_and_gt_integrity
      - pixel_and_visual_realism
      - temporal_and_denominator_operability
      - capture_operator_execution
    forbidden_inputs:
      - predictions
      - confidences
      - segmentation_tracking_or_action_metrics
      - registered_hypothesis_distance
  source_integrity:
    all_hashes_exact: true
    unpinned_source_allowed: false
    overwrite_existing_v1_release: false
  pair_integrity:
    exact_arms: 2
    exact_frames_per_arm: 30
    identical_shared_field_digest: true
    identical_canonical_gt_digest: true
    differences_restricted_to_allowlist: true
    any_locked_pair_failure_invalidates_release: true
  pixel_visual:
    native_dimensions_px: [2048, 2048]
    full_frame_resize_allowed: false
    decodable_lossless_rgb_required: true
    mean_brightness: [40.0, 205.0]
    maximum_fully_clipped_white_fraction: 0.002
    maximum_fully_clipped_black_fraction: 0.001
    maximum_crop_free_frame_fraction: 0.05
    maximum_weed_free_frame_fraction: 0.25
    mean_crop_fraction: [0.01, 0.60]
    mean_weed_fraction: [0.01, 0.50]
    minimum_crop_model_variants_per_split: 6
    minimum_ground_families_per_split: 2
    minimum_environment_families_per_split: 2
    exact_profile_balance_required: true
    distinct_latent_rgb_duplicates_allowed: false
    identical_ideal_degraded_rgb_allowed: false
    deterministic_rerender_required: true
  split_integrity:
    cross_split_overlap_forbidden:
      - asset_identity
      - crop_or_weed_model_variant
      - ground_or_environment_family
      - source_scene
      - source_or_derived_seed
      - trajectory_or_nuisance_seed
      - latent_pair
      - video
      - frame
      - gt_track
    adjacent_source_frames_across_splits_allowed: false
  temporal_denominator:
    minimum_calibration_eligible_weed_tracks: 64
    minimum_locked_test_eligible_weed_tracks: 128
    every_test_synthetic_field_has_eligible_weed: true
    minimum_three_observation_track_exists_in_every_cell: true
    monotonic_timestamps_and_encoder_required: true
  manual_review:
    split: calibration
    pairs_per_cell: 2
    selection: audit_sample_seed_before_model_access
    arms_side_by_side: true
    predictions_or_metrics_visible: false
    locked_test_human_review_before_threshold_lock: false
    permitted_judgments:
      - renderer_corruption
      - class_and_track_overlay_correctness
      - pair_mismatch
      - capture_envelope_violation
  mandatory_lock_order:
    - freeze_protocol_sources_seeds_cells_envelopes_estimands_and_code_hashes
    - generate_and_machine_audit_both_arms_for_both_splits
    - complete_frozen_calibration_only_manual_review
    - seal_release_lock_with_model_outputs_present_false
    - run_degraded_calibration_inference_and_select_threshold
    - seal_threshold_lock_with_test_predictions_present_false
    - optionally_compute_ideal_calibration_diagnostics_without_selection_weight
    - unlock_and_run_both_locked_test_arms_once
    - compute_paired_metrics_once_and_seal_result

gt_contract:
  authority: persistent_source_scene_objects_not_semantic_connected_regions
  classes: [crop, weed]
  required_per_object_fields:
    - stable_source_object_id
    - stable_gt_track_id
    - class_name
    - per_frame_visible_polygon_or_mask
    - visible_fraction
    - occluded
    - partial
    - canopy_span_mm_from_world_geometry
    - world_transform
    - source_asset_identity
  action_manifest_fields:
    - frame_id
    - image_path
    - field_id
    - session_id
    - video_id
    - frame_index
    - timestamp_ns
    - encoder_mm
    - exposure_us
    - gain_db
    - working_distance_mm
    - strobe_profile_id
    - split
    - instances
  evidence_scope: synthetic_fixture
  safe_region:
    outer_ring_px: 64
    clipped_image_boundary_is_partial: true
    canonical_action_region_absent_is_partial: true
    later_nonpartial_observation_can_make_track_eligible: true
  known_current_proxy_limit:
    proxy_label_interpretation: connected_semantic_region_not_botanical_instance
    botanical_instance_ids_available: false
    proxy_allowed_as_video_track_gt: false
  discovery_gate:
    status_before_runtime_binding: UNRESOLVED_FAIL_CLOSED
    required_before_full_render: true
    success_requires_all:
      - stable_object_ids_across_frames
      - valid_per_frame_polygons_or_masks
      - canopy_span_in_world_mm
      - defensible_visibility_or_occlusion
      - split_pure_asset_provenance
    failure_status: REPLAN_REQUIRED_GT_TRACK_IDENTITY
  forbidden_gt_construction:
    - semantic_connected_components
    - optical_flow_pseudo_tracks
    - model_predicted_tracker_ids
    - manual_post_outcome_track_repair

inference_contract:
  checkpoint_sha256: 3aba4b19b69455c0532edf0ff81622b2499fab376d7b5c8854b644027af73100

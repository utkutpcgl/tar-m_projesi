calibration_contract:
  sole_threshold_source:
    split: calibration
    arm: degraded
  ideal_calibration_role: post_lock_diagnostic_only
  test_access_forbidden_until_threshold_lock: true
  threshold_grid:
    start: 0.05
    stop: 0.95
    step: 0.05
  selection: maximum_recall_subject_to_frozen_precision_crop_and_duplicate_safety
  tie_breakers: [f1, precision, higher_threshold]
  fallback: maximum_f1_on_degraded_validation_and_force_infeasible_status
  fallback_is_safe_threshold: false
  one_shared_threshold_for_ideal_and_degraded_test: true
  arm_specific_thresholds_allowed: false
  capture_model_tracker_or_estimand_changes_after_calibration_allowed: false
  infeasible_status: SIM_AB_CALIBRATION_INFEASIBLE_SYNTHETIC_ONLY

action_evaluator_binding:
  config_source_id: frozen_action_contract
  implementation_source_id: frozen_action_evaluator
  modification_allowed: false
  frozen_semantics:
    eligible_weed_minimum_canopy_span_mm: 20.0
    eligible_weed_minimum_visible_fraction: 0.70

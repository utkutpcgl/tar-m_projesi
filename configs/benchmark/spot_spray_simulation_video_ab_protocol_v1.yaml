  evidence_class: SYNTHETIC_DIAGNOSTIC_ONLY
  system_under_test: frozen_one_bay_controlled_spot_spray_perception_to_action_stack
  experimental_question: >-
    On identical held-out latent video sequences, how much do the declared
    bounded capture-profile differences change segmentation, tracking, and

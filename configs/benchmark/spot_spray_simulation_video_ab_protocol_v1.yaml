    one_to_one_eligible_gt_track_matching: true
    crop_collision_precedence: true
    partial_or_unknown_hit_is_false_positive: true
    duplicate_hit_is_false_positive: true
    attempted_shot_safety_denominators: true
    crop_hit_wilson_upper_95_authoritative: true
  two_run_orchestration:

dataset:
  task: segment
  class_names:
    0: crop
    1: weed
  train_split: train
  validation_split: validation
  forbidden_training_splits: [test, unassigned]
  image_link_mode: symlink
  supported_image_suffixes: [.jpg, .jpeg, .png, .bmp, .tif, .tiff, .webp]
  require_source_image_exists: true
  require_source_image_sha256_match_when_declared: true
  require_declared_image_sha256_for_real: true
  partial_unknown:
    policy: quarantine_entire_frame
    rationale: Ultralytics segmentation has no ignore-region target; retaining the frame would silently train unresolved plant pixels as background.
    materialize_image: false
    materialize_label: false
  require_nonempty_train_after_quarantine: true
  require_nonempty_validation_after_quarantine: true
  test_images_materialized: false
  test_labels_materialized: false

model_family:
  name: YOLO26s-seg
  package: ultralytics
  package_version: 8.4.60

training:
  epochs: 30
  patience: 0
  image_size: 1024
  batch: 3
  workers: 8
  device: 0
  seed: 41
  deterministic: true
  amp: true
  optimizer: AdamW
  lr0: 0.00015
  lrf: 0.10
  momentum: 0.9
  weight_decay: 0.0005
  warmup_epochs: 1.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  cos_lr: true
  cache: false
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.25
  degrees: 5.0
  translate: 0.05
  scale: 0.15
  shear: 0.0
  perspective: 0.0
  fliplr: 0.5
  flipud: 0.0
  mosaic: 0.0
  mixup: 0.0
  copy_paste: 0.0
  close_mosaic: 0
  mask_ratio: 1
  overlap_mask: true
  val: true
  plots: false
  pretrained: true

selection:
  final_checkpoint: last.pt
  rule: fixed_epoch_30_last_checkpoint_only
  best_checkpoint_used_for_final: false
  validation_role: monitoring_only_then_later_action_threshold_calibration
  test_role: forbidden_during_training_checkpoint_selection_and_threshold_calibration

output:
  run_name: target_rig_seg_finetune_seed41_e30
  dataset_yaml: dataset.yaml
  dataset_index: dataset_index.json
  dataset_receipt: dataset_receipt.json
  training_receipt: training_receipt.json
  final_checkpoint_receipt: final_checkpoint_receipt.json

exit_codes:
  ready_or_complete: 0
  not_ready: 2
  fixture_only: 4
  contract_error: 5

claims:
  - The selected ROSE-native checkpoint is a fine-tuning foundation, not field-performance or deployment proof.
  - Only audit-accepted real train and validation frames may enter a real run; test paths and labels are never materialized in the training dataset.
  - Any frame containing partial_unknown is quarantined in full because the trainer has no ignore-region target and must not learn unresolved plant pixels as background.
  - The fixed final epoch checkpoint is selected without test access; validation is monitoring-only and remains the sole later threshold-calibration source.
  - Dry-run and fixture receipts prove contract mechanics only and can never serve as a final target-rig checkpoint receipt.
  - Training completion does not imply offline model GO, field-fire GO, or chemical-fire GO.

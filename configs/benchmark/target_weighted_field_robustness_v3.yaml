schema_version: 3
scope: strict_real_only_target_weighted_cross_field_crop_segmentation_selection
frozen_before_challenger_training: true
frozen_at: '2026-08-04T11:30:21+03:00'
control: simab_real_sorghum_cropcraft_v3_05_paddy_v4_05_e8
synthetic_weight_in_real_score: 0.0
model_replacement_allowed_only_if_all_checks_pass: true
deployment_or_spray_claim_allowed: false

locked_evidence:
  - name: sugarbeets2016_multiclass_holdout_release
    path: data/processed/audits/sugarbeets2016_multiclass_holdout_v1_manual_visual_review.json
    sha256: 14838cedb0970560c0d5dc06f0d04761fd5f5bee5ae9aac231613e3140aef036
    required_true: [all_release_gates_passed, holdout_release_accepted]

deployment_envelope:
  viewpoint: close-range nadir or mildly oblique RGB from a ground robot
  camera_height_m: [0.30, 1.30]
  crops: mixed broadleaf, cereal and paddy crops
  illumination: daylight, overcast, partial shadow, optional robot light
  exclusions: [depth, multispectral-only inference, aerial-only deployment]

# Every entry is one dataset-level vote after field/session macro averaging.
real_domains:
  real_core_current:
    panel: target_like
    role: legacy_source_validation_regression_check_not_new_independence_evidence
  sugarbeets2016_holdout:
    panel: target_like
    role: newly_frozen_field_and_session_disjoint_close_nadir_bonirob_holdout
  cwfid:
    panel: target_like
    role: close_nadir_carrot_field
  sorghum_weed:
    panel: target_like
    role: close_nadir_row_crop
  cropandweed:
    panel: target_like
    role: multi_condition_close_crop_views
  rice_seedling_weed:
    panel: target_like
    role: close_nadir_early_paddy
  riceseg_country_transfer:
    panel: target_like
    role: country_held_out_rice_for_models_with_zero_riceseg_training_exposure
  growingsoy:
    panel: target_like
    role: longitudinal_close_soy_views
  weedmap_uav:
    panel: breadth
    role: aerial_scale_shift
  tobacco_uav:
    panel: breadth
    role: aerial_campaign_shift
  deblur_sharp:
    panel: breadth
    role: matched_single_capture_sharp_diagnostic
  deblur_motion_blur:
    panel: breadth
    role: matched_single_capture_motion_diagnostic

ranking:
  primary: real_target_weighted_domain_balanced_mean_iou
  weights:
    target_like_domain_macro: 0.60
    breadth_domain_macro: 0.25
    domain_balanced_field_tail: 0.15
  tail_fraction: 0.25
  class_metrics_reported: [three_class_mean_iou, crop_iou, weed_iou]
  dataset_image_count_weighting: forbidden
  pixel_micro_weighting_across_datasets: forbidden
  synthetic_tie_breaker: >-
    allowed only after all real acceptance checks pass; never modifies the real
    score or rescues a real-domain regression

acceptance:
  minimum_mean_primary_gain: 0.002
  minimum_mean_target_like_gain: 0.003
  minimum_primary_wins: 2
  maximum_primary_regression: 0.002
  maximum_target_like_regression: 0.005
  maximum_tail_regression: 0.010
  maximum_any_field_mean_iou_regression: 0.025
  maximum_domain_mean_iou_regression:
    target_like: 0.010
    breadth: 0.015

required_confirmation:
  paired_seeds: [17, 29, 43]
  same_epoch_or_step_budget: true
  same_real_and_synthetic_draw_budget: true
  same_evaluator_source_hash: true
  candidate_and_control_field_units_must_match: true

data_eligibility:
  real_validation_only: true
  no_image_or_near_duplicate_overlap_with_training: true
  no_capture_session_overlap_with_training: true
  new_target_holdout_field_overlap_with_training: false
  new_target_holdout_release_accepted_before_model_evaluation: true
  annotation_ontology: exhaustive_common_0_1_2_255
  partial_label_sources: forbidden_for_new_holdout
  external_test_or_final_test_used_for_selection: false
  online_unlabeled_video_used_for_numeric_accuracy: false

safety_reporting:
  crop_spray_risk_and_safe_weed_recall: mandatory_diagnostic
  semantic_winner_implies_spray_ready: false
  separate_field_safety_gate_required: true

known_limitations:
  - the new Sugar Beets holdout is one field, date, and strongly correlated robot session
  - current real_core validation remains a legacy regression panel with four of six fields overlapping training
  - several older domains are consumed development/calibration sets, not fresh final tests
  - BAWSeg remains pending authenticated artifact access
  - this selector can replace the semantic benchmark recipe but cannot establish deployment or spray safety

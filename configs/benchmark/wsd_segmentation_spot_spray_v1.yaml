    start: 0.34
    stop: 0.99
    step: 0.02

output: processed/audits/wsd_segmentation_spot_spray_v1

claims:
  - The accepted global segmentation model has never trained on WSD frames.
  - Detection trained on the WSD train date; the comparison measures the practical target-domain annotation plus task effect, not architecture alone.
  - WSD supplies boxes and stem points but no semantic masks, so segmentation mIoU cannot be measured on WSD.
  - Validation alone selects segmentation action generation and confidence; the test date does not tune them.
  - Crop identity is field metadata in deployment and is routed as maize or soybean, not inferred from model output.
  - Weed-box intersection is an optimistic spray proxy and is not tissue deposition or kill.

ontology_policy:
  target_identity: exactly_one_official_crop_group_in_semantic_mask
  no_target_crop: exclude
  multiple_target_crops: exclude
  raw_255_ambiguous_vegetation: ignore
  unsupported_raw_species: ignore

expected_counts:
  source_images: 8034
  included_samples: 4584
  excluded_no_target_crop: 3341
  excluded_multiple_target_crops: 109
  bbox_semantic_labelset_mismatches: 66

split_policy:
  version: cropandweed_session_stratified_milp_v1
  frozen_before_training: true
  grouping_key: recording_session
  train_role: train
  holdout_role: external_calibration
  holdout_images: 917
  holdout_sessions: 87
  total_eligible_sessions: 437
  optimization: exact_20_percent_images_and_nearest_20_percent_sessions
  stratification:
    - application_or_experimental_set
    - target_crop_species
    - moisture
    - soil_texture
    - lighting
    - crop_weed_separability
    - crop_by_set
    - crop_by_moisture
    - crop_by_lighting
  note: >-
    The split was optimized from annotations only, before any model training or
    evaluation. Rare soil=2 has only two eligible sessions, so one whole session
    is held out and its image ratio cannot be 20 percent.


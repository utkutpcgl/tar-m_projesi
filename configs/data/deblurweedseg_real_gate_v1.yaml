    val: 2595c01368b30e2ab742c6cf2732ec7f78ffd5c39a26db16f976d822961dd24c
    test: 95a813a2780ce2ce6e191bda160adc9e897475d46bf7b7666c8577d83f77ea63
  split_id_sequence_sha256:
    train: 98f08a1725e5b263ee491c5b4da5ad382f3b5e90faf3a9c463dd843f0f71c963
    val: 6d7b989879affd5241615f53cb4564ebeace2cfdb944144a6139d30a764bf952
    test: fc019fe2ca1ce525b3c85eaeacbd37b1921e2112ce7151885b973d593adaefde
  crop_boxes_xyxy:
    sharp_rgb: [4, 4, 132, 132]
    blur_rgb: [136, 4, 264, 132]
    sharp_mask: [4, 136, 132, 264]
    blur_mask: [136, 136, 264, 264]
  panel_width: 128
  panel_height: 128
  source_palette_rgb_to_common:
    "199,199,199": 0
    "31,119,180": 1

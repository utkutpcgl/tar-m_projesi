ontology:
  background_soil: 0
  sorghum_bicolor_target_crop: 1
  chenopodium_album_and_cirsium_arvense: 2
  ignore: 255
  target_crop_id: 4
  crop_species: Sorghum bicolor
  weed_species: Chenopodium album;Cirsium arvense
  annotation_exhaustive: true

role_policy:
  included_publisher_split: test
  output_role: external_calibration
  modalities: [sharp, motion_blur]
  paired_modalities_must_share_role: true
  publisher_train_and_val_pairs_quarantined: 1200
  rationale: >-
    The source does not publish original-frame, flight-run, or spatial group
    identifiers. Only the publisher's 100-pair holdout is exposed as a new
    development stress domain. The other 1,200 pairs are not training data in
    this phase, preventing hidden source-frame leakage into the evaluation.
  independence_limit: >-
    This is one experimental field and one acquisition period. It is not an
    unseen-field test and must never be presented as multi-field evidence.

capture:
  field_id: southern_germany_experimental_sorghum_field_2020
  session_id: publisher_test_single_field_uav_mission_2020_09
  capture_date: 2020-09
  platform: DJI Mavic 2 Pro UAV at 5 m
  sensor: Hasselblad L1D-20c RGB 20MP; publisher 128x128 paired crops
  growth_stage: BBCH 13

quality_gate:
  require_exact_archive_size_and_sha256: true
  require_safe_archive_members: true
  require_exact_split_partition: true
  require_exact_composite_dimensions: true
  require_fully_opaque_alpha: true
  require_exact_mask_palette: true
  require_all_common_classes_per_modality: true
  require_paired_output_count: 100
  forbid_publisher_train_or_val_output: true
  forbid_pretrained_publisher_model: true
  forbid_external_test_claim: true

outputs:
  manifest: processed/manifests/deblurweedseg.csv
  sharp_manifest: processed/manifests/deblurweedseg_sharp_calibration_v1.csv
  blur_manifest: processed/manifests/deblurweedseg_blur_calibration_v1.csv
  conversion_report: processed/manifests/deblurweedseg_conversion.json
  images_root: processed/deblurweedseg/images
  masks_root: processed/deblurweedseg/common_masks

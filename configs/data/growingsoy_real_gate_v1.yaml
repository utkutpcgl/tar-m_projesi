# The publisher's random train/valid/test split places adjacent frames from
# every video in all three partitions. It is ignored. The paper and README say
# that fixed plantation sections with different chemical treatments were
# followed over time. The paired videos consistently form two longitudinal
# trajectories; the weed-richer trajectory B is used for training and the
# other complete trajectory is retained for calibration across the full cycle.
longitudinal_trajectories:
  trajectory_a:
    role: external_calibration
    videos:
      - 20221216-GX010015
      - 20221221-GX010104
      - 20221227-GX010163
      - 20230103-GX010189
      - 20230110-GX010220
      - 20230114-GX010233
  trajectory_b:
    role: train
    videos:
      - 20221216-GX010025
      - 20221221-GX010110
      - 20221227-GX010170
      - 20230103-GX010195
      - 20230110-GX010226
      - 20230114-GX010238


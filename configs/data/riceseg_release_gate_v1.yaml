split_protocols:
  coverage_training:
    purpose: all-country training coverage with whole-subdataset development holdouts
    split_unit: subdataset_country_institute_site_year
    expected_roles: {train: 2474, external_calibration: 604}
    holdout_subdatasets: [GD, TKO_2]
    external_test_claim: false
    rationale: >-
      Use all five countries in training while holding out complete source
      groups. GD supplies an independent reproductive-stage smartphone/site
      stress and TKO_2 supplies a large all-growth-stage fixed-camera year.
      JS_3 and JS_4 stay together because both are NJAU/Jiangsu/2023. No
      image-level random split and no untouched-test claim are permitted.
  country_transfer_diagnostic:
    purpose: zero-shot geographic transfer diagnostic before target-country exposure
    source_countries: [China, Japan]
    target_countries: [India, Tanzania, Philippines]
    expected_source_images: 1824
    expected_target_images: 1254
    training_unlocks_target_countries: false
    external_test_claim: false
    contamination_rule: >-
      This diagnostic is valid only before any model has trained on TG,
      Kilimanjaro, or Laguna. Once those groups enter training, retain the old
      receipt as historical evidence and never report a fresh zero-shot claim.

forbidden_actions:
  - publisher_random_image_split
  - subdataset_across_multiple_roles
  - model_result_based_split_selection
  - source_organ_labels_overwritten
  - external_or_final_test_claim
  - commercial_training_claim_before_license_reconciliation

outputs:
  release_inspection_receipt: processed/audits/riceseg_release_inspection_v1.json
  condition_strata_receipt: processed/audits/riceseg_condition_strata_v1.json

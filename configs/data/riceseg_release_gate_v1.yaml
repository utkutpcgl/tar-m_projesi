    4: weed
    5: duckweed
  common_mapping:
    0: 0
    1: 1
    2: 1
    3: 1
    4: 2
    5: 2
  common_classes: {0: background, 1: crop, 2: weed}
  target_crop_id: 12
  crop_species: Oryza sativa
  annotation_exhaustive: true
  mapping_note: >-
    Green vegetation, senescent rice tissue, and panicles are target-crop
    pixels. Publisher weed and duckweed are non-crop vegetation and map to the
    common weed class. The six-class source masks must also be preserved for
    organ-level diagnostics; common conversion must never overwrite them.


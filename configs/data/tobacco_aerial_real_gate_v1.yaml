canonical_member_policy:
  source_archive: release_v2
  image: Tobacco Aerial Dataset/Campaign no. {campaign}/{patch_directory}/data/{index}.png
  mask: Tobacco Aerial Dataset/Campaign no. {campaign}/{patch_directory}/mask/{index}.png
  maskref: Tobacco Aerial Dataset/Campaign no. {campaign}/{patch_directory}/maskref/{index}.png
  forbid_as_rgb_input:
    - Detected vegetation
    - release_v1 test/RGB22
  forbid_as_ground_truth:
    - maskref
    - Binary vegetation mask
    - Labelled 1080P images
  patch_tree_digest_algorithm: >-
    SHA-256 over kind UTF-8, NUL, decimal index UTF-8, NUL, and the raw
    SHA-256 digest of each payload; kinds ordered data, mask, maskref and
    indices ordered numerically within each kind.

parent_frame_policy:
  patches_per_parent: 12
  patch_order_within_parent: column_major; three rows per column and four columns
  parent_block_formula: floor((one_based_patch_index - 1) / 12) + 1
  source_evidence: >-
    Campaigns 2-8 reconstruct every released 1920x1080 source frame exactly
    over the retained top 1056 rows. Campaign 1 has a publisher release
    mismatch between its 1080P folders and patch tree, but all 72 consecutive
    12-patch blocks reconstruct spatially coherent 1920x1056 frames; median
    seam/internal RGB mean-absolute-difference ratio is 1.049850 and maximum
    is 1.186187. The same 864 patch triples are byte-identical in both nested
    releases. Parent IDs therefore refer to patch blocks, not the mismatched
    Campaign 1 original filenames.
  campaign_1_maximum_seam_internal_mad_ratio: 1.186187

resolved_release_anomalies:
  campaign_1_1080p_mismatch:
    observed: >-
      None of Campaign 1's 864 released RGB patches or visualization masks is
      an exact crop of the separately bundled 72 Original/Labelled 1080P
      files. The other seven campaigns reconstruct all 138 parent frames
      exactly from their patch blocks.
    resolution: >-
      Use only the publisher-designated Patch images/data and Patch
      images/mask pairs. Their labels are exact 0/1/2 grayscale masks, their
      blocks are spatially coherent, and their complete patch trees are
      byte-identical across the V1 and V2 nested releases. Do not use or claim
      alignment with Campaign 1's 1080P folders.
  duplicated_detected_vegetation_views:
    observed: >-
      V1 contains RGB and RGB22 copies for Campaigns 3-8; RGB22 is a
      background-removed visualization, not an independent field sample.
    resolution: >-
      Use only canonical V2 Patch images/data RGB patches and count each patch
      once. Never sample RGB22 or detected-vegetation views.


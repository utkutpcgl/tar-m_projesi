balanced_selection:
  campaign_patch_cap: 120
  selected_parent_blocks_per_campaign: 10
  method: >-
    Select ten numeric parent-block positions including both endpoints with
    index floor(i * (N - 1) / 9 + 0.5), for i=0..9 and N parent blocks. Keep
    all twelve patches of every selected block. This is fixed and independent
    of RGB, mask content, class balance, or model output.


  archive_path: raw/weedmap/archives/WeedMap_OPIA_2023.zip
  archive_size_bytes: 4480204702
  archive_sha256: 8247a5a2e690ee77a34eb7bdcb3a1729c7ce3c8f6ef3ef9ff93067f17e90c53b

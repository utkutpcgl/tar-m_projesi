  official_landing_page: https://www.research-collection.ethz.ch/entities/researchdata/0a5dcd76-cc44-4fbe-9f48-d8a717c90a30
  official_readme: https://www.research-collection.ethz.ch/bitstreams/deb4d587-278a-4aa4-bcc4-132234af185e/download
  mirror_landing_page: https://ngdc.cncb.ac.cn/opia/dataset/datasets?dataId=30

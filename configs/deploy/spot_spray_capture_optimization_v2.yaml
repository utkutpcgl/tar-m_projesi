    encoder_scale_error_maximum_mm_per_m: 1.0
    trigger_encoder_timestamp_delta_p95_maximum_us: 100.0
    trigger_encoder_timestamp_delta_maximum_us: 250.0
    stale_encoder_no_fire_after_ms: 5.0
    host_arrival_timestamp_for_control_forbidden: true
  calibration:
    installed_window_focus_aperture_and_light_state_frozen: true
    intrinsic_and_distortion_model: calibrated_per_camera_lens_mount
    ground_homography_residual_p95_maximum_mm: 1.0
    ground_homography_residual_maximum_mm: 2.0
    daily_registration_drift_no_fire_threshold_mm: 2.0
    camera_to_nozzle_along_track_offset: physically_measured_not_CAD_assumed
    command_encoder_position_formula: >-
      capture_encoder_mm + measured_camera_to_nozzle_offset_mm -
      speed_mm_s * measured_valve_onset_latency_s
    actuation_schedule_rule: >-
      Abort rather than fire if the encoder-position deadline cannot absorb
      measured worst-case inference, transport, controller, and valve latency.
    dry_marker_end_to_end_error_p95_maximum_mm: 5.0
    dry_marker_end_to_end_error_maximum_mm: 10.0
    nozzle_latency_and_footprint: water_sensitive_paper_or_fluorescent_dye_measurement
    no_fire_distance_formula: footprint_radius_plus_p95_total_registration_error
  compute:
    accelerator: measured_NVIDIA_RTX_3090
    model_checkpoint_sha256: 0b30e1433cecb4ecaa71a1005c520604eaacab9a92595efb18f3966bcd57f6b8
    one_module_15_hz_is_only_currently_supported_baseline: true
    target_20_hz_requires_end_to_end_p95_rebenchmark: true
    two_or_more_cameras_require_separate_compute_or_new_multi_module_benchmark: true
    reference_GPU_power_w: 350.0
    reference_minimum_system_PSU_w: 750.0
  safety:
    SELV_LPS_power_required: true
    fused_camera_light_controller_branches: true
    emergency_stop_hard_cuts_strobe_and_valve_enable: true
    watchdog_default: no_fire
    no_fire_on: [timestamp_invalid, encoder_stale, frame_drop, calibration_invalid, overtemperature, hood_open]
    chemical_fire_blocked_until_deposition_and_crop_injury_gates: true


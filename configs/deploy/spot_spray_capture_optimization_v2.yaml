bench_acceptance_stages:
  - stage: A_procurement_and_identity
    gates:
      - exact order numbers, color sensor, IR-cut state, lens, cable, and power variant recorded
      - supplier quote and lead time refreshed after 2026-08-11
  - stage: B_transport_trigger_and_thermal
    gates:
      - zero missing or duplicate frame counters in 10000 hardware triggers at 20 Hz
      - timestamp, encoder, strobe jitter and two-hour thermal gates pass
      - powered USB fallback separately repeats brownout and EMI challenge
  - stage: C_optics_and_window
    gates:
      - all nine regions pass local 10 mm, 20 mm, MTF50, distortion, and reprojection limits
      - all three object-distance planes pass with focus and iris locked
  - stage: D_light_hood_and_polarization
    gates:
      - ambient ratio, uniformity, luma, clipping, SNR, and thermal gates pass
      - polarization remains off unless its paired wet-glare gate passes
  - stage: E_motion_tracking_and_compute
    gates:
      - moving target at 0.5 and 1.0 m/s stays at or below 0.75 px blur
      - at least five valid-region observations at 1.0 m/s and 12 Hz
      - one-module 15 Hz end-to-end p95 deadline passes with camera, tracking, and result transfer
  - stage: F_registration_and_safe_actuation
    gates:
      - homography, encoder scale, time alignment, and dry marker registration pass
      - physical nozzle latency, footprint, deposition, and crop-injury gates pass before chemical enable


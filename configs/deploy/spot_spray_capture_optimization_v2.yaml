schema_version: 2
contract: controlled_spot_spray_capture_optimization_v2
status: READY_FOR_MANAGER_VALIDATION
evidence_date: 2026-08-11
decision_scope: >-
  One hooded, fixed-light, global-shutter RGB proof module. Scale width by
  replicating independently benchmarked modules; this contract does not claim
  that one measured RTX 3090 sustains two cameras.


baseline_optics:
  camera_model: a2A2464-77ucPRO
  lens:
    manufacturer: Basler
    model: C23-0824-5M-P
    order_number: 2200000568
    marketing_focal_length_mm: 8.0
    nominal_design_focal_length_mm: 8.06
    catalog_focal_length_tolerance_fraction: 0.05
    sensor_coverage: 2/3_inch
    resolution_mp: 5.0
    rated_pixel_pitch_um: 3.45
    aperture_range_f_number: [2.4, 16.0]
    selected_aperture_f_number: 5.6
    mount: C_mount
    minimum_working_distance_mm: 100.0
    public_price:
      amount: 136.0
      currency: USD
      kind: manufacturer_net_list
      source_key: basler_lens_spec_and_price
  roi:
    raw_sensor_px: [2448, 2048]
    centered_native_px: [2048, 2048]
    centered_native_offset_px: [200, 0]
    digital_resize_forbidden: true
    active_sensor_span_mm: 7.0656
  geometry:
    optical_axis: nadir
    target_ground_FOV_mm: [474.0, 484.0]
    nominal_ground_FOV_mm: 480.0
    working_distance_adjustment_mm: [520.0, 590.0]
    working_distance_rule: >-
      Adjust the installed camera height until the measured ground FOV is in
      range, then freeze and record that unit's working distance. The mount
      range covers the lens maker's nominal focal tolerance; do not assume a
      catalog 550 mm distance for every delivered lens.
    focus_plane_offset_above_ground_mm: 55.0
    canopy_relief_above_ground_mm: [0.0, 110.0]
    focus_rule: focus_at_ground_working_distance_minus_55mm_then_lock
    circle_of_confusion_um: 3.45
    design_wavelength_nm: 550.0
    fov_model: thin_lens_prescreen_only
    final_rule: measured_nine_region_geometry_and_MTF_override_catalog_math
  nine_region_gate:
    normalized_centers:
      - [0.125, 0.125]
      - [0.500, 0.125]
      - [0.875, 0.125]
      - [0.125, 0.500]
      - [0.500, 0.500]
      - [0.875, 0.500]
      - [0.125, 0.875]
      - [0.500, 0.875]
      - [0.875, 0.875]
    region_window_px: [256, 256]
    local_gsd_maximum_mm_px: 0.24390243902439024
    minimum_10_mm_span_px: 41.0
    minimum_20_mm_span_px: 82.0
    object_plane_offsets_above_ground_mm: [0.0, 55.0, 110.0]
    object_plane_rule: >-
      For the unit's frozen working distance, test at ground distance minus
      each offset; this follows the calibrated height rather than assuming
      one catalog focal length.
    mtf50_minimum_cycles_per_px: 0.15
    intrinsic_reprojection_rms_maximum_px: 0.30
    intrinsic_reprojection_p95_maximum_px: 0.50
    installed_window_required_during_test: true
    locked_focus_and_iris_witness_marks_required: true
    pass_rule: every_region_at_every_test_plane_must_pass_without_averaging

tiling_and_swath:
  proof_camera_count: 1
  proof_ground_FOV_class_mm: 500.0
  tile_grid: [2, 2]
  tile_core_px: 1024
  halo_px: 64
  model_input_px: 1152
  internal_seam_policy: native_adjacent_sensor_pixels_then_clip_to_core
  outer_edge_policy: reflect_pad_for_compute_but_force_outer_64px_ring_to_abstain
  full_frame_downscale_forbidden: true
  multi_module_center_pitch_maximum_mm: 430.0
  minimum_calibrated_safe_swath_overlap_mm: 10.0
  standalone_proof_hood_internal_plan_mm: [600.0, 600.0]
  scaled_continuous_hood_internal_width_formula: >-
    600 mm + (camera_count - 1) * center_pitch_mm
  scale_rule: >-
    Extend one continuous matte hood/skirt and repeat complete
    camera-light-trigger bays at no more than 430 mm center pitch, with matte
    inter-bay baffles. Give every camera a dedicated USB3 root controller and
    independently proven accelerator capacity; synchronize triggers but do
    not share an unbenchmarked RTX 3090 inference budget.
  compute_extrapolation_rule: >-
    Multi-camera rows replicate the measured batch-4 module service time
    serially. They are workload consequences, not a batch-8 or concurrent
    multi-camera benchmark; only a new end-to-end benchmark may supersede them.

motion_and_observation:
  speeds_m_s: [0.5, 1.0]
  maximum_motion_blur_px: 0.75
  frozen_exposure_us: 170.0
  acquisition_rate_hz:
    hard_minimum: 12.0
    baseline: 15.0
    target_after_end_to_end_gate: 20.0
  temporal_policy:
    confirmations: 3
    preferred_window: 5
    guarantee_uses_outer_abstain_safe_length: true

illumination:
  architecture: >-
    Four independently current-limited broad-spectrum white LED quadrants,
    symmetric around the lens and firing through opal diffusers into the
    enclosed ground volume.
  correlated_color_temperature_target_k: [4500, 5500]
  color_rendering_index_minimum: 90
  trigger_source: camera_ExposureActive_via_isolated_driver
  camera_exposure_us: 170.0
  nominal_pulse_us: 150.0
  maximum_pulse_us: 170.0
  maximum_rate_hz: 20.0
  pulse_containment: nominal_pulse_fully_inside_global_exposure
  pulse_width_error_maximum_fraction: 0.05
  trigger_to_light_jitter_p95_maximum_us: 5.0
  electrical_design_envelope:
    bus_voltage_v: 24.0
    programmable_peak_current_a: [0.0, 10.0]
    peak_electrical_ceiling_w: 240.0
    light_branch_average_power_maximum_w: 20.0
    complete_capture_module_average_power_maximum_w_excluding_compute: 60.0
    maximum_bus_droop_fraction_during_pulse: 0.05
    conservative_local_storage_prescreen_at_10A_150us_uF: 1250.0
    storage_note: assumes_upstream_supplies_zero_pulse_current_then_bench_bus_droop
    rule: ceiling_not_operating_setpoint
  thermal_gates:
    soak_duration_minutes: 120
    exterior_ambient_test_c: [5.0, 40.0]
    camera_housing_maximum_c: 50.0
    LED_plate_maximum_c: 60.0
    no_frame_drop_or_thermal_throttle: true
  image_gates:
    corrected_ambient_off_on_luma_ratio_maximum_each_region: 0.10
    nine_region_luma_min_to_max_ratio_minimum: 0.75
    frame_mean_luma_range_8bit: [40.0, 205.0]
    fully_clipped_white_fraction_maximum: 0.002
    fully_clipped_black_fraction_maximum: 0.001
    temporal_snr_18pct_gray_minimum_db: 20.0
  bench_variable_rule: >-
    Lux, optical joules, LED current, and renderer energy have no frozen
    physical value until measured on the installed hood. Search current only
    inside the electrical ceiling; reject the light if no setting passes SNR,
    clipping, uniformity, ambient rejection, exposure, and thermal gates.
  polarization:
    default: off
    design: source_sheet_plus_lens_analyzer_crossed_90_deg
    enable_only_if: >-
      Paired wet-leaf/soil bench reduces saturated-glare area by at least 50%
      without violating 170 us exposure, SNR, uniformity, or thermal gates.

hood_and_window:
  scaling:
    architecture: one_continuous_hood_with_repeated_optical_bays
    camera_center_pitch_maximum_mm: 430.0
    inter_bay_finish: matte_black_baffles_without_blocking_safe_swath_overlap
    shared_skirt_rule: continuous_two_layer_skirt_without_direct_sky_gaps
    acceptance: each_bay_and_overlap_strip_pass_ambient_and_uniformity_gates
  shell:
    inside_finish: matte_black_low_reflectance
    minimum_internal_plan_mm: [600.0, 600.0]
    geometry: rigid_top_and_walls_with_no_direct_ground_to_sky_line_of_sight
  skirt:
    material: matte_black_flexible_EPDM_or_coated_fabric
    layers: 2
    layer_length_mm: [100.0, 150.0]
    stagger_overlap_mm: [30.0, 50.0]
    ground_clearance_operating_mm: [0.0, 20.0]
    rule: overlapping_slits_and_inner_labyrinth_preserve_terrain_compliance
    breakaway_and_no_entanglement_gate_required: true
  labyrinth:
    stages: 2
    minimum_baffle_depth_mm: 50.0
    cable_openings: rear_facing_gasketed_S_path
  protective_window:
    material: replaceable_AR_coated_optical_glass
    thickness_mm: [2.0, 3.0]
    tilt_deg: [3.0, 5.0]
    requirements: [sealed, cleanable, no_direct_strobe_return, calibrated_installed]
  ambient_acceptance: >-
    With fixed camera controls, dark-frame-corrected strobe-off divided by
    strobe-on luma must be <=0.10 in every one of nine regions at the measured
    intended worst exterior ambient condition. Record exterior lux; an
    unmeasured ambient challenge cannot pass.


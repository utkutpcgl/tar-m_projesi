schema_contract:
  owners:
    - sensor_optics
    - light_enclosure
    - platform_carrier
    - compute_capture
    - safety_acceptance
    - intervention_external
    - host_owner
    - integration_only
  decision_states:
    - FROZEN_BASELINE
    - OPEN_BENCH_VARIABLE
    - HOST_UNRESOLVED
    - CHALLENGER_CLOSED_NOT_TRIGGERED
    - CHALLENGER_ELIGIBLE_BOUNDED_AB
    - REJECTED
    - UNSUPPORTED
    - OUT_OF_SCOPE
  evidence_classes:
    - FROZEN_REPOSITORY_CONTRACT
    - TERMINAL_LANE_DECISION
    - DETERMINISTIC_CALCULATION
    - ENGINEERING_INTEGRATION_INFERENCE
    - PHYSICAL_MEASUREMENT
    - NO_EVIDENCE_NULL
  integration_results:
    - INTEGRATION_CONSISTENT_PRE_REAL
    - INTEGRATION_INVALID_SOURCE_DRIFT
    - INTEGRATION_INVALID_CROSS_LANE_CONFLICT
    - REPLAN_REQUIRED

status_axes:
  architecture_selection: FROZEN_BASELINE
  source_integrity: VERIFY_AT_BUILD
  host_qualification: HOST_UNRESOLVED
  physical_acceptance: PRE_REAL_NOT_READY
  controlled_capture_authorized: false
  dry_marker_ready: false
  field_go: false
  product_go: false
  chemical_fire_allowed: false
  purchase_authorized: false

claim_boundary:
  integration_validation_is_physical_acceptance: false
  physical_A_to_E_receipt_available: false
  physical_A_to_F_receipt_available: false
  certified_ingress_claim: false
  autonomous_operation_in_scope: false
  procurement_or_fabrication_authority: false
  note: >-
    A consistent result proves only that pinned desk evidence and deterministic
    calculations agree. It cannot authorize capture, dry-marker, field, product,
    purchase, fabrication, or chemical operation.

evidence_ledger:
  sourced_facts:
    evidence_classes: [FROZEN_REPOSITORY_CONTRACT, TERMINAL_LANE_DECISION]
    result_paths: [source_integrity.sources, baseline, decision_items]
    claim_limit: exact_pinned_desk_evidence_not_installed_hardware_evidence
  deterministic_calculations:
    evidence_class: DETERMINISTIC_CALCULATION
    result_paths: [calculations, bom.totals]
    claim_limit: arithmetic_from_pinned_primitives_not_physical_measurement
  integration_hypotheses:
    evidence_class: ENGINEERING_INTEGRATION_INFERENCE
    result_paths: [ownership_boundary, coordinate_frames, spatial_contract, interface_contract]
    claim_limit: interface_hypothesis_only_cannot_create_a_physical_PASS
  physically_unmeasured:
    evidence_class: NO_EVIDENCE_NULL
    result_paths: [decision_items, calculations.mechanical_payload, calculations.power_status]
    claim_limit: unknowns_remain_null_until_owning_physical_evidence_exists
  physical_measurements:
    evidence_class: PHYSICAL_MEASUREMENT
    result_paths: [acceptance_binding]
    current_product_receipt_count: 0
    claim_limit: reserved_for_hash_bound_rig_evaluator_receipts_none_current


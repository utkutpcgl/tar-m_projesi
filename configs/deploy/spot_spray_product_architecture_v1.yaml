fail_safe_interfaces:
  - fault_id: estop
    owner: safety_acceptance
    scope: whole_carrier
    immediate_action: hard_cut_strobe_and_intervention_enable
    pending_command_action: discard_all
    recovery: explicit_clear_plus_new_startup_identity_witness
  - fault_id: watchdog
    owner: safety_acceptance
    scope: controlled_scope
    immediate_action: no_fire
    pending_command_action: discard_all_in_scope
    recovery: healthy_watchdog_plus_new_startup_identity_witness
  - fault_id: hood_open
    owner: light_enclosure
    scope: affected_bay
    immediate_action: inhibit_strobe_and_no_fire
    pending_command_action: discard_affected_bay
    recovery: hood_closed_interlock_valid_plus_new_light_witness
  - fault_id: overtemperature
    owner: light_enclosure
    scope: affected_bay
    immediate_action: inhibit_strobe_and_no_fire
    pending_command_action: discard_affected_bay
    recovery: temperature_valid_plus_explicit_fault_clear_and_new_witness
  - fault_id: invalid_timestamp
    owner: compute_capture
    scope: affected_frame
    immediate_action: no_fire
    pending_command_action: discard_affected_frame_and_track_command
    recovery: new_same_event_timestamp_witness
  - fault_id: stale_encoder
    owner: platform_carrier
    scope: affected_carrier
    immediate_action: no_fire
    pending_command_action: discard_all_scheduled_commands
    recovery: valid_signed_encoder_and_scale_witness
  - fault_id: frame_drop
    owner: compute_capture
    scope: affected_frame_and_bay
    immediate_action: no_fire
    pending_command_action: discard_affected_frame_and_track_command
    recovery: next_complete_identity_bound_frame_only
  - fault_id: deadline_miss
    owner: compute_capture
    scope: affected_frame_and_bay
    immediate_action: no_fire
    pending_command_action: discard_late_result
    recovery: next_result_inside_frozen_deadline_only
  - fault_id: calibration_invalid
    owner: safety_acceptance
    scope: affected_bay
    immediate_action: no_fire
    pending_command_action: discard_affected_bay
    recovery: matching_calibration_identity_and_required_retest
  - fault_id: profile_mismatch
    owner: light_enclosure
    scope: affected_frame_and_profile
    immediate_action: inhibit_strobe_and_no_fire
    pending_command_action: discard_affected_profile_commands
    recovery: matching_capture_strobe_bench_profiles_plus_new_witness
  - fault_id: malformed_strobe
    owner: light_enclosure
    scope: affected_frame_and_profile
    immediate_action: inhibit_strobe_and_no_fire
    pending_command_action: discard_affected_profile_commands
    recovery: valid_timing_path_plus_applicable_stage_retest
  - fault_id: partial_light_channel_failure
    owner: light_enclosure
    scope: affected_frame_and_bay
    immediate_action: inhibit_strobe_and_no_fire
    pending_command_action: discard_affected_bay
    recovery: all_four_channels_observed_plus_new_witness
  - fault_id: invalid_deployed_state
    owner: platform_carrier
    scope: affected_carrier_or_section
    immediate_action: no_fire
    pending_command_action: discard_all_in_scope
    recovery: hard_seated_deployed_identity_valid
  - fault_id: lift_or_transport_state
    owner: platform_carrier
    scope: affected_carrier
    immediate_action: no_fire
    pending_command_action: discard_all
    recovery: operating_state_and_transport_lock_release_valid
  - fault_id: reverse_or_ambiguous_direction
    owner: platform_carrier
    scope: affected_carrier
    immediate_action: no_fire
    pending_command_action: discard_all_scheduled_commands
    recovery: signed_forward_direction_witness
  - fault_id: brownout_or_reboot
    owner: safety_acceptance
    scope: whole_carrier
    immediate_action: hard_cut_strobe_and_intervention_enable
    pending_command_action: discard_all
    recovery: power_valid_plus_explicit_clean_startup_witness


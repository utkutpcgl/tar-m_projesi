    test_only_after_wet_scene_OFF_baseline: true
    promote_if: glare_area_reduction_at_least_50_percent_and_all_other_D_gates_PASS
    rollback: off
  Basler_BAS:
    default: not_purchased
    trigger: PRO_supply_blocks_schedule_or_production_scale_savings_exceed_full_retest_cost
    validation: repeat_full_A_E_on_exact_host_USB_power_topology
  FLIR_BFS_U3_51S5C_C:
    default: not_purchased
    trigger: >-
      PRO supply blocks the proof schedule, or one bounded remediation cannot
      resolve a proven camera-intrinsic SNR, sensor-artifact or transport failure.
    validation: repeat_full_A_E
  wider_FOV_or_higher_resolution:
    default: not_purchased
    trigger: service_size_below_20mm_or_swath_requirement_invalidates_current_geometry
    rule: new_optical_compute_and_real_action_contract_required


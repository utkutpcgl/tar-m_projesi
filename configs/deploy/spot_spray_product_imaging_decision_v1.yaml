stopping_rules:
  - Stop camera research when one PRO baseline passes physical A-E and no explicit challenger trigger exists.
  - Do not buy a challenger only because it might be better.
  - Stop current tuning after one bounded remediation fails the same decisive stage twice.
  - Keep 15 Hz when the 20 Hz absolute gate fails.
  - Keep polarization off when its paired wet-scene gate fails.
  - Do not plan multiple cameras before one-module A-E PASS and an explicit swath requirement.
  - Keep below-20-mm intervention closed until dedicated real target-rig evidence changes the service contract.

replan_triggers:
  - PRO_or_C23_unavailable_for_proof_schedule
  - target_FOV_unreachable_in_working_distance_range
  - any_of_27_cells_permanently_fails_20mm_or_MTF_gate
  - no_light_operating_point_passes_all_D_gates
  - motion_blur_exceeds_0p75px_at_1mps_and_170us
  - one_camera_15Hz_end_to_end_gate_fails
  - required_speed_exceeds_1mps
  - required_safe_swath_exceeds_444p375mm
  - intended_temperature_exceeds_5_to_40C_proof_envelope
  - certified_ingress_washdown_dust_shock_or_vibration_becomes_required
  - nozzle_or_crop_safety_contract_changes_the_20mm_service_class
  - camera_lens_EOL_or_interface_change

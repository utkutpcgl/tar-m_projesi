schema_version: 1
protocol_id: cropcraft_agri_asset_quality_v2
frozen_before_asset_pack_build: true
frozen_at_utc: '2026-08-02T00:00:00+03:00'
scope: research_semantic_crop_segmentation

locked_data_policy:
  allowed_for_selection:
    - source_real_validation
    - cwfid_external_calibration
    - sorghum_weed_external_calibration
  forbidden_for_selection:
    - sorghum_weed_external_test
  external_test_used_for_asset_or_model_selection: false
  note: >-
    The previously consumed Sorghum external_test is historical evidence only.
    A model selected from this asset study requires a new untouched field test.

asset_pack_gate:
  crop_plant_type: sorghum_seedling_v2
  minimum_crop_models: 15
  minimum_crop_growth_stages: 5
  minimum_faces_per_crop_model: 350
  weed_plant_types:
    - weed_cotyledon_v2
    - weed_broadleaf_v2
    - weed_grass_v2
    - weed_rosette_v2
  minimum_models_per_weed_type: 6
  minimum_background_debris_models: 12
  maximum_degenerate_faces_per_model: 0
  maximum_declared_height_relative_error: 0.02
  required_ground_families: 3
  required_environment_families: 3
  accepted_third_party_asset_licenses: [CC0-1.0]
  require_file_hashes_and_source_urls: true
  require_capacity_check: true

smoke_release_gate:
  expected_rgb_mask_pairs: 12
  expected_independent_scenes: 3
  maximum_crop_free_frame_fraction: 0.0
  maximum_weed_free_frame_fraction: 0.20
  maximum_exact_rgb_duplicates: 0
  maximum_exact_mask_duplicates_across_scenes: 0
  minimum_mean_crop_fraction: 0.002
  maximum_mean_crop_fraction: 0.35
  minimum_mean_weed_fraction: 0.002
  maximum_mean_weed_fraction: 0.25
  require_exact_semantic_palette: true
  require_manual_rgb_mask_visual_review: true

pilot_release_gate:
  expected_rgb_mask_pairs: 100
  expected_independent_scenes: 25
  train_scenes: 20
  validation_scenes: 5
  maximum_crop_free_frame_fraction: 0.0
  maximum_weed_free_frame_fraction: 0.10
  maximum_exact_rgb_duplicates: 0
  maximum_exact_mask_duplicates_across_scenes: 0
  minimum_used_crop_model_variants: 10
  minimum_used_ground_families: 3
  minimum_used_environment_families: 3
  minimum_mean_crop_fraction: 0.002
  maximum_mean_crop_fraction: 0.30
  minimum_mean_weed_fraction: 0.002
  maximum_mean_weed_fraction: 0.20
  require_scene_disjoint_split: true
  require_exact_semantic_palette: true

downstream_equal_budget_gate:
  control: simab_real_sorghum_cropcraft10_e8_v1
  challenger: simab_real_sorghum_cropcraft_agri10_e8_v2
  seeds: [17, 29, 43]
  fixed_epoch: 8
  checkpoint: last.pt
  samples_per_epoch: 3600
  total_training_samples: 28800
  synthetic_sampler_exposure: 0.10
  primary_metric:
    name: per_seed_robust_semantic_mean_iou
    definition: >-
      min(source_real_validation_mean_iou, cwfid_mean_iou,
      sorghum_weed_mean_iou)
  acceptance:
    mean_paired_primary_delta_must_be_greater_than: 0.0
    minimum_primary_wins_out_of_3: 2
    maximum_allowed_mean_source_validation_miou_regression: 0.01
    maximum_allowed_mean_sorghum_validation_miou_regression: 0.01
  fallback_if_gate_fails: retain_stock_asset_control
  safety_policy_used_for_selection: false
  spray_deployment_eligible_from_this_protocol: false

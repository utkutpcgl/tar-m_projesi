schema_version: 1
release: cropcraft_agri_robust_smoke_v3
purpose: pre_pilot_texture_and_scale_smoke
base_config: configs/simulation/cropcraft_agri_base_v2.yaml
asset_pack: data/raw/synthetic_assets/cropcraft_agri_robust_v3_r3
asset_pack_id: cropcraft_agri_robust_v3_r3
crop_bed_name: sorghum_rows
crop_plant_type: sorghum_seedling_v2
cycle_crop_asset_heights: true
base_seed: 272000
scene_count: 3
frames_per_scene: 4
train_scenes: 2
validation_scenes: 1

asset_profile:
  ground_material_ids:
    - dry_mud_field_001
    - brown_mud
    - cracked_red_ground
  environment_files:
    - farm_field_puresky_2k.hdr
    - overcast_soil_puresky_2k.hdr
    - citrus_orchard_puresky_2k.hdr

weed_density_ranges:
  cotyledon: cotyledon_density
  broadleaf: broadleaf_density
  grass: grass_density
  rosette: rosette_density

ranges:
  camera_height_m: [0.36, 1.15]
  camera_height_crop_ratio: [4.0, 8.0]
  camera_fov_deg: [46.0, 72.0]
  camera_roll_deg: [-4.0, 4.0]
  camera_pitch_deg: [-4.0, 4.0]
  camera_yaw_deg: [-8.0, 8.0]
  camera_y_jitter_m: [0.01, 0.12]
  environment_rotation_deg: [0.0, 360.0]
  crop_asset_heights_m: [0.06, 0.13, 0.24, 0.09, 0.18]
  crop_height_scale: [0.94, 1.06]
  crop_height_tolerance: [0.08, 0.18]
  within_row_spacing_m: [0.18, 0.42]
  between_row_spacing_m: [0.55, 0.90]
  position_noise_m: [0.005, 0.035]
  tilt_noise_rad: [0.01, 0.12]
  scale_noise: [0.03, 0.18]
  missing_crop_probability: [0.0, 0.0]
  cotyledon_density: [18.0, 45.0]
  broadleaf_density: [9.0, 25.0]
  grass_density: [9.0, 25.0]
  rosette_density: [6.0, 20.0]
  stone_density: [12.0, 50.0]

quality_gates:
  expected_pairs: 12
  max_crop_free_frame_fraction: 0.0
  max_weed_free_frame_fraction: 0.20
  max_exact_rgb_duplicates: 0
  max_exact_mask_duplicates_across_scenes: 0
  minimum_mean_crop_fraction: 0.002
  maximum_mean_crop_fraction: 0.30
  minimum_mean_weed_fraction: 0.002
  maximum_mean_weed_fraction: 0.20
  minimum_used_crop_model_variants: 3
  minimum_used_ground_families: 3
  minimum_used_environment_families: 3

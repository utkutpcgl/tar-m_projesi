quality_contract:
  train_distribution: >-
    V3-anchored plant/camera composition plus broad soil/tillage and four
    balanced correlated weather/light profiles
  val_test_distribution: >-
    the same plausible profile families with central ranges and asset-disjoint
    soil/HDRI families
  cross_role_asset_overlap_allowed: false
  cross_role_seed_overlap_allowed: false
  synthetic_roles_in_real_selection_score: false
  one_followup_iteration_after_v10_failure: true

      tillage_scale: [3.0, 24.0]
      tillage_angle_deg: [0.0, 180.0]
      clod_strength: [0.0, 0.34]
      clod_scale: [9.0, 60.0]
      sun_energy: [0.0, 1.25]
      sun_elevation_deg: [8.0, 78.0]
      sun_azimuth_deg: [0.0, 360.0]
      sun_angle_deg: [0.2, 12.0]
      local_shadow_fraction: [0.0, 0.48]
      shadow_seed: [320000.0, 329999.0]
      artificial_light_energy: [0.0, 155.0]
      artificial_light_size_m: [0.12, 0.90]
      artificial_light_warmth: [0.05, 0.95]
    correlated_scene_profiles:
      - name: clear_day
        environment_files:
          - farm_field_puresky_2k.hdr
          - citrus_orchard_puresky_2k.hdr
          - harvest_2k.hdr
        surface_parameter_ranges:
          environment_strength: [0.55, 0.90]
          soil_moisture: [0.00, 0.40]
          sun_energy: [0.75, 1.25]
          sun_elevation_deg: [35.0, 78.0]

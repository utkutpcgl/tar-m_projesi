schema_version: 1
base_study: configs/simulation/cropcraft_field_robustness_pilot_v10_r1.yaml
release: cropcraft_field_robustness_pilot_v11_r1
purpose: >-
  single bounded follow-up to V10: retain its asset-disjoint soil/tillage
  coverage while restoring V3-like plant visibility and replacing independent
  illumination extremes with balanced correlated weather/light profiles
frames_per_scene: 2

# The V10 model screen showed that simultaneously widening camera, crop
# missingness, lighting and surface ranges weakened close-view field units.
# V11 restores the accepted V3 composition prior. Surface diversity remains
# broad, but physically related light variables are sampled together below.
shared_ranges:
  camera_height_m: [0.36, 1.15]
  camera_height_crop_ratio: [4.0, 8.0]
  camera_fov_deg: [46.0, 72.0]
  camera_roll_deg: [-4.0, 4.0]
  camera_pitch_deg: [-4.0, 4.0]
  camera_yaw_deg: [-8.0, 8.0]
  camera_y_jitter_m: [0.01, 0.12]
  crop_asset_heights_m: [0.06, 0.09, 0.13, 0.18, 0.24]
  crop_height_scale: [0.94, 1.06]
  crop_height_tolerance: [0.08, 0.18]
  within_row_spacing_m: [0.18, 0.42]
  between_row_spacing_m: [0.55, 0.90]
  position_noise_m: [0.005, 0.035]
  tilt_noise_rad: [0.01, 0.12]
  scale_noise: [0.03, 0.18]
  missing_crop_probability: [0.0, 0.0]
  cotyledon_density: [18.0, 45.0]
  broadleaf_density: [9.0, 25.0]
  grass_density: [9.0, 25.0]
  rosette_density: [6.0, 20.0]
  stone_density: [8.0, 55.0]

splits:
  train:
    scenes: 40
    base_seed: 320000
    ranges:

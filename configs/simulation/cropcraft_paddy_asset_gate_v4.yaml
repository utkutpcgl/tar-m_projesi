schema_version: 1
protocol_id: cropcraft_paddy_asset_quality_v4
frozen_before_asset_pack_build: true
frozen_at_utc: '2026-08-02T20:40:33+03:00'
scope: research_semantic_crop_segmentation

control_lock:
  pack_id: cropcraft_agri_robust_v3_r3
  pack_manifest_sha256: bc41b9b1a262eb886586d81e6d947c91cf24878c9df5a9962c46edfe6ba633b0
  pilot_release: cropcraft_agri_robust_pilot_v3
  pilot_release_receipt_sha256: cb8d45c27bf45f65814843e3d14c62103968f31fe32ee9091c150e427b7a6e69
  selected_recipe: simab_real_sorghum_cropcraft_robust10_e8_v3
  selected_seed_43_checkpoint_sha256: 2fed7e2b4a3e42b183ffa3911d2014ed60e8088efc5532b7a79753d7356b3771

locked_data_policy:
  allowed_for_selection:
    - source_real_validation
    - cwfid_external_calibration
    - sorghum_weed_external_calibration
    - cropandweed_external_calibration
    - rice_seedling_weed_train_only_as_unexposed_synthetic_transfer_development
  forbidden_for_selection:
    - real_core_final_test
    - carrot_weed_external_test
    - ewis1_external_test
    - sorghum_weed_external_test
  rice_policy: >-
    Real Rice tiles may evaluate candidates trained only with synthetic paddy
    data; they may not evaluate candidates trained with those same real tiles.
  external_test_used_for_asset_or_model_selection: false

asset_hypothesis:
  target_gap: >-
    The accepted v3 recipe is dry-soil/sorghum centered and scores only
    0.311910 zero-shot mIoU on the unexposed Rice paddy set. Add shallow-water,
    wet-mud, early Oryza, Sagittaria and grass-like hard-negative assets.
  isolated_change: synthetic_domain_asset_and_scene_recipe
  fixed_controls:
    - model_architecture_and_pretraining
    - optimizer_and_augmentation
    - epoch_and_samples_per_epoch
    - total_synthetic_sampler_exposure_0.10
    - real_data_sampler_weights
  rejected_as_out_of_scope:
    - real_rice_training_tiles
    - synthetic_volume_scaling
    - model_or_hyperparameter_change
    - locked_test_access

asset_pack_gate:
  crop_plant_type: rice_seedling_v4
  required_crop_species: Oryza sativa
  required_primary_weed_species: Sagittaria trifolia
  minimum_crop_models: 60
  minimum_unique_crop_geometries: 20
  minimum_crop_growth_stages: 5
  minimum_crop_albedo_phenotypes: 3
  minimum_faces_per_crop_model: 600
  weed_plant_types:
    - sagittaria_trifolia_v4
    - paddy_grass_weed_v4
    - aquatic_broadleaf_v4
  minimum_models_per_weed_type: 12
  minimum_texture_backed_weed_models: 36
  minimum_background_debris_models: 12
  maximum_degenerate_faces_per_model: 0
  maximum_declared_height_relative_error: 0.02
  required_ground_families: 3
  minimum_wet_ground_families: 3
  required_environment_families: 3
  minimum_paddy_environment_families: 3
  required_surface_profile: shallow_paddy_v4
  accepted_third_party_asset_licenses: [CC0-1.0]
  require_file_hashes_and_source_urls: true
  require_capacity_check: true

pilot_release_gate:
  expected_rgb_mask_pairs: 100
  expected_independent_scenes: 25
  train_scenes: 20
  validation_scenes: 5
  camera_height_m: [0.8, 1.2]
  maximum_crop_free_frame_fraction: 0.0
  maximum_weed_free_frame_fraction: 0.05
  maximum_exact_rgb_duplicates: 0
  maximum_exact_mask_duplicates_across_scenes: 0
  minimum_used_crop_model_variants: 20
  minimum_used_ground_families: 3
  minimum_used_environment_families: 3
  minimum_used_surface_profiles: 1
  minimum_water_coverage_span: 0.35
  minimum_mean_crop_fraction: 0.025
  maximum_mean_crop_fraction: 0.25
  minimum_mean_weed_fraction: 0.01
  maximum_mean_weed_fraction: 0.16
  require_scene_disjoint_split: true
  require_exact_semantic_palette: true
  require_manual_rgb_mask_visual_review: true

downstream_equal_budget_gate:
  control: simab_real_sorghum_cropcraft_robust10_e8_v3
  screen_challengers:
    - simab_real_sorghum_cropcraft_v3_05_paddy_v4_05_e8
    - simab_real_sorghum_cropcraft_paddy_v4_10_e8
  screen_seeds: [17]
  confirmation_seeds: [17, 29, 43]
  fixed_epoch: 8
  checkpoint: last.pt
  samples_per_epoch: 3600
  total_training_samples: 28800
  total_synthetic_sampler_exposure: 0.10
  primary_metric:
    name: five_domain_robust_semantic_mean_iou
    definition: >-
      min(source, CWFID, Sorghum, CropAndWeed, Rice paddy development mIoU)
  screen_acceptance:
    minimum_rice_mean_iou_delta: 0.01
    minimum_robust_mean_iou_delta: 0.005
    maximum_allowed_each_existing_domain_regression: 0.01
    minimum_macro_mean_iou_delta: 0.0
  confirmation_acceptance:
    mean_paired_primary_delta_must_be_greater_than: 0.0
    minimum_primary_wins_out_of_3: 2
    minimum_mean_rice_miou_delta: 0.01
    maximum_allowed_mean_each_existing_domain_regression: 0.01
  fallback_if_gate_fails: retain_v3_global_control
  safety_policy_used_for_selection: false
  spray_deployment_eligible_from_this_protocol: false


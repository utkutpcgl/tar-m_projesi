output_enabled: [description]
output:
  description:
    type: field_description
    format: json
    filename: field_description.json

render:
  directory: render
  frames: 4
  samples: 32
  cycles_device: GPU
  resolution_x: 512
  resolution_y: 512
  env_rotation_deg: 0.0
  camera:
    height: 1.0
    fov_deg: 60.0
    roll_deg: 0.0
    pitch_deg: 0.0
    yaw_deg: 0.0
    y_jitter: 0.04
  label_colors:
    crop: [0, 255, 0]
    weed: [255, 0, 0]
    background: [0, 0, 0]

field:
  random_seed: 284001
  headland_width: 2.5
  scattering_extra_width: 0.8
  beds:
    rice_rows:
      plant_type: rice_seedling_v4
      plant_height: 0.14
      height_tolerance_coeff: 0.08
      plant_distance: 0.23
      bed_width: 1.20
      row_distance: 0.28
      rows_count: 3
      plants_count: 30
      beds_count: 1
      orientation: aligned
  noise:
    position: 0.025
    tilt: 0.05
    scale: 0.10
    missing: 0.04
  weeds:
    sagittaria:
      plant_type: sagittaria_trifolia_v4
      max_height: 0.15
      density: 16.0
      distance_min: 0.055
      noise_scale: 0.38
      noise_offset: 0.08
    paddy_grass:
      plant_type: paddy_grass_weed_v4
      max_height: 0.17
      density: 13.0
      distance_min: 0.045
      noise_scale: 0.33
      noise_offset: 0.06
    aquatic_broadleaf:
      plant_type: aquatic_broadleaf_v4
      max_height: 0.11
      density: 8.0
      distance_min: 0.065
      noise_scale: 0.42
      noise_offset: 0.12
  stones:
    density: 3.0
    distance_min: 0.04
    noise_scale: 0.36
    noise_offset: 0.10


schema_version: 1
release: cropcraft_paddy_smoke_v4_r2
purpose: r2_pre_pilot_morphology_turbidity_and_brightness_smoke
base_config: configs/simulation/cropcraft_paddy_base_v4.yaml
scene_patch: patches/cropcraft/0003-paddy-water-profile-r2.patch
asset_pack: data/raw/synthetic_assets/cropcraft_paddy_robust_v4_r2

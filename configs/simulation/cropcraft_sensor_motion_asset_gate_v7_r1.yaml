prebuild_preflight_amendment: >-
  The first invocation stopped before creating any output because both source
  manifests correctly preserve their original 80-train/20-val scene roles.
  The builder's incorrect all-train assumption was replaced, before any asset
  build, by an exact scene 0-19=train and 20-24=val assertion. No threshold,
  kernel, source, output, or downstream acceptance rule changed.

data_root: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data

hypothesis:
  measured_gap: >-
    The accepted model loses roughly 0.176 mIoU between matched sharp and
    motion-blurred DeBlurWeedSeg development images. Existing training applies
    occasional isotropic Gaussian blur but no directional exposure trajectory.
  isolated_change: >-
    Decode each accepted dryland/paddy synthetic RGB once, integrate it through
    a normalized sub-pixel camera-shake PSF, and preserve the exact source mask.
  why_not_new_botanical_mesh: >-
    Dryland V3 and paddy R5 already passed multi-seed real-domain asset gates.
    Soy morphology repeatedly improved its target domain but failed global
    non-inferiority; another unmeasured mesh is not the smallest supported fix.
  real_deblurweedseg_pixels_in_assets_or_training: 0
  deblurweedseg_role_before_model_screen: >-
    Prior diagnostic motivates the physical nuisance only. No kernel length,
    angle, curvature, image, mask, cutout, or texture is fitted or copied from
    DeBlurWeedSeg. Its fixed sharp/blur pairs may later be development-only
    model-screen evidence, never an external-test claim.
  forbidden_changes:
    - botanical_geometry_change
    - soil_or_hdri_change
    - crop_or_weed_density_change
    - source_mask_change
    - real_image_pixels_in_synthetic_assets
    - model_or_hyperparameter_change_during_asset_build
    - external_or_final_test_use


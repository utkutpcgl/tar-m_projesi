hypothesis:
  measured_r1_success: >-
    V7-R1 improved real single-field motion-blur mean IoU by 0.064939 versus
    the accepted control and 0.069539 versus matched compute. The camera-shake
    RGB hypothesis is therefore useful.
  measured_r1_failure: >-
    At 2.439 percent sampling, hard latent masks reduced CWFID by 0.052882 and
    0.025866, WeedMap by 0.013881 and 0.016959, and existing robust/macro
    metrics. Strong motion visibly makes the unchanged hard boundary
    uncertain even though it remains registered to the latent scene.
  isolated_asset_change: >-
    Reuse every V7-R1 RGB and PSF byte-for-byte. For each valid source-mask
    pixel, convolve the one-hot map of its original class by the exact RGB PSF.
    Retain the original label only if that class occupies at least half of the
    exposure trajectory; otherwise set the pixel to ignore=255. Never relabel
    a valid pixel to another semantic class and never revert source ignore.
  why_not_new_mesh_or_real_fit: >-
    Dryland V3 and paddy R5 already passed multi-seed real-domain gates, while
    R1 directly demonstrated sensor-target gain. No real DeBlurWeedSeg pixel,
    mask, cutout, kernel fit, or model output may enter R2 assets.

prebuild_synthetic_only_threshold_scan:
  inputs: frozen_v7_r1_masks_and_exact_psfs_only
  real_development_metrics_used: false
  thresholds_checked: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75]
  selected_threshold: 0.50
  selection_reason: >-
    This is the least destructive physically meaningful majority threshold.
    The read-only scan predicted 2.2551 percent new ignore while retaining
    99.2630 percent background, 79.2276 percent crop, and 84.8365 percent weed.
    Higher thresholds removed 27-53 percent of crop supervision and were
    rejected before any output build.

label_policy:
  original_class_confidence_threshold: 0.50
  probability_operator: exact_v7_r1_psf_convolution_of_original_class_one_hot
  convolution_border: reflect_101
  output_rule: original_label_if_confidence_gte_threshold_else_ignore_255
  valid_class_relabeling_allowed: false
  source_ignore_reversion_allowed: false
  soft_labels_used: false
  note: >-
    The current hard-label engine has no soft-target channel. Ignore is the
    fail-closed representation of an exposure-integrated ambiguous boundary.

quality_gate:
  expected_samples: 200
  expected_train_samples: 160
  expected_calibration_samples: 40
  minimum_new_ignore_fraction: 0.015
  maximum_new_ignore_fraction: 0.030
  minimum_background_retention: 0.990
  minimum_crop_retention: 0.780
  minimum_weed_retention: 0.830
  maximum_images_with_crop_entirely_uncertain: 1
  maximum_images_with_weed_entirely_uncertain: 1
  require_exact_r1_rgb_sha256_reuse: true
  require_no_valid_pixel_relabeling: true
  require_no_source_ignore_reversion: true
  require_scene_disjoint_split: true
  require_manual_uncertainty_overlay_review: true
  inherit_r1_real_duplicate_gate_only_if_every_rgb_sha256_is_identical: true

capacity:
  expected_output_bytes: 134217728
  minimum_free_bytes_after: 21474836480


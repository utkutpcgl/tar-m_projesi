output_enabled: [blender, description]
output:
  blender:
    type: blender_file
    filename: scene.blend
  description:
    type: field_description
    format: json
    filename: field_description.json

render:
  directory: render
  frames: 4
  samples: 8
  cycles_device: GPU
  resolution_x: 512
  resolution_y: 512
  env_rotation_deg: 0.0
  camera:
    height: 1.2
    fov_deg: 65.0
    roll_deg: 0.0
    pitch_deg: 0.0
    yaw_deg: 0.0
    y_jitter: 0.05
  label_colors:
    crop: [0, 255, 0]
    weed: [255, 0, 0]
    background: [0, 0, 0]

field:
  random_seed: 170001
  headland_width: 3.0
  scattering_extra_width: 1.0
  beds:
    maize_rows:
      plant_type: maize
      plant_height: 0.35
      height_tolerance_coeff: 0.25
      plant_distance: 0.30
      bed_width: 1.60
      row_distance: 0.75
      rows_count: 2
      plants_count: 24
      beds_count: 1
      orientation: aligned
  noise:
    position: 0.015
    tilt: 0.04
    scale: 0.10
    missing: 0.08
  weeds:
    broadleaf_low:
      plant_type: portulaca
      max_height: 0.03
      density: 4.0
      distance_min: 0.10
      noise_scale: 0.31
      noise_offset: 0.08
    broadleaf_tall:
      plant_type: polygonum
      max_height: 0.08
      density: 2.5
      distance_min: 0.14
      noise_scale: 0.40
      noise_offset: 0.15
    rosette:
      plant_type: taraxacum
      max_height: 0.07
      density: 1.5
      distance_min: 0.18
      noise_scale: 0.36
      noise_offset: 0.12
  stones:
    density: 8.0
    distance_min: 0.08
    noise_scale: 0.36
    noise_offset: 0.20

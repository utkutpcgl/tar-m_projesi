  selected_seed_43_checkpoint_sha256: b97618224621950e46bd47136bad43f51e417c11121674bc1849a9f7322b3d9f

locked_data_policy:
  allowed_for_selection:
    - source_real_validation
    - cwfid_external_calibration
    - sorghum_weed_external_calibration
    - cropandweed_external_calibration
    - rice_seedling_weed_unexposed_synthetic_transfer_development
    - growingsoy_external_calibration_as_unexposed_synthetic_transfer_development
  forbidden_for_selection:
    - real_core_final_test
    - carrot_weed_external_test
    - ewis1_external_test
    - sorghum_weed_external_test
  growingsoy_policy: >-
    GrowingSoy may evaluate candidates whose soybean-domain exposure is entirely
    synthetic. No GrowingSoy real image, mask, crop, cutout or texture may be
    used to train, render, composite or texture a challenger in this protocol.
  real_growingsoy_training_exposure: 0.0
  external_test_used_for_asset_or_model_selection: false

asset_hypothesis:
  target_gap: >-
    Adding 10% real GrowingSoy exposure improved its seed-17 mIoU by 0.296242
    but regressed CWFID by 0.048174 and CropAndWeed by 0.014734. Test whether a
    bounded soybean-specific synthetic domain can improve unexposed GrowingSoy
    transfer while preserving the accepted dryland and paddy domains.
  isolated_change: synthetic_soy_domain_asset_and_scene_recipe
  fixed_controls:
    - model_architecture_and_pretraining
    - optimizer_and_augmentation
    - fixed_epoch_and_samples_per_epoch
    - total_synthetic_sampler_exposure_0.10
    - real_dataset_sampler_weights
    - dryland_v3_soil_hdri_and_debris_foundation
  rejected_as_out_of_scope:
    - real_growingsoy_training_images_or_masks
    - image_cutout_or_texture_copying_from_growingsoy
    - synthetic_volume_scaling_before_gate
    - model_or_hyperparameter_change
    - unreal_engine_migration
    - locked_test_access

approved_cc0_reference_models:
  - asset_id: grass_bermuda_01
    target_family: cynodon_dactylon_v5
    semantic_role: exact_common_name_reference_for_Cynodon_dactylon
    source: Poly_Haven_official_API
    license: CC0-1.0
    caveat: >-
      Texture-backed Bermuda-grass authored variants are appearance references,
      not measured single seedlings; every exported group must be normalized to
      an explicit early-weed height and width gate.

asset_pack_gate:
  crop_plant_type: soybean_early_v5
  required_crop_species: Glycine max
  required_weed_species:
    - Amaranthus viridis
    - Cynodon dactylon
  minimum_crop_models: 60
  minimum_unique_crop_geometries: 20
  minimum_crop_growth_stages: 5
  minimum_crop_albedo_phenotypes: 3
  minimum_faces_per_crop_model: 700
  minimum_final_stage_trifoliolate_nodes: 3
  require_cotyledon_and_unifoliolate_stage_traits: true
  weed_plant_types:
    - amaranthus_viridis_v5
    - cynodon_dactylon_v5
  minimum_models_per_weed_type: 16
  minimum_texture_backed_weed_models: 12
  minimum_exact_species_reference_sources: 1
  required_reference_texture_roles: [diffuse, normal, arm]
  maximum_reference_width_height_ratio: 6.0
  minimum_background_debris_models: 12
  maximum_degenerate_faces_per_model: 0
  maximum_declared_height_relative_error: 0.02
  required_ground_families: 3
  required_environment_families: 3
  accepted_third_party_asset_licenses: [CC0-1.0]
  require_file_hashes_and_source_urls: true
  require_capacity_check: true

pilot_release_gate:
  expected_rgb_mask_pairs: 100
  expected_independent_scenes: 25
  train_scenes: 20
  validation_scenes: 5
  camera_height_m: [0.55, 1.35]
  maximum_crop_free_frame_fraction: 0.0
  maximum_weed_free_frame_fraction: 0.25
  maximum_exact_rgb_duplicates: 0
  maximum_exact_mask_duplicates_across_scenes: 0
  minimum_used_crop_model_variants: 20
  minimum_used_ground_families: 3
  minimum_used_environment_families: 3
  minimum_mean_crop_fraction: 0.04
  maximum_mean_crop_fraction: 0.35
  minimum_mean_weed_fraction: 0.005
  maximum_mean_weed_fraction: 0.10
  require_scene_disjoint_split: true
  require_exact_semantic_palette: true
  require_manual_rgb_mask_visual_review: true
  require_full_resolution_rgb_mask_review: true
  require_cross_scene_near_duplicate_audit: true
  require_domain_gap_audit_against_growingsoy_and_existing_real: true

downstream_equal_budget_gate:
  control: simab_real_sorghum_cropcraft_v3_05_paddy_v4_05_e8
  screen_challenger_mixes:
    - dryland_v3_0.050_paddy_v4_0.025_soy_v5_0.025
    - dryland_v3_0.040_paddy_v4_0.030_soy_v5_0.030
  screen_seeds: [17]
  confirmation_seeds: [17, 29, 43]
  fixed_epoch: 8
  checkpoint: last.pt
  samples_per_epoch: 3600
  total_training_samples: 28800
  total_synthetic_sampler_exposure: 0.10
  primary_metric:
    name: six_domain_robust_semantic_mean_iou
    definition: >-
      min(source, CWFID, Sorghum, CropAndWeed, Rice paddy and GrowingSoy
      development mIoU)
  screen_acceptance:
    minimum_growingsoy_mean_iou_delta: 0.01
    minimum_robust_mean_iou_delta: 0.0
    maximum_allowed_each_existing_domain_regression: 0.01
    minimum_macro_mean_iou_delta: 0.0
  confirmation_acceptance:
    mean_paired_primary_delta_must_be_greater_than: 0.0
    minimum_primary_wins_out_of_3: 2
    minimum_mean_growingsoy_miou_delta: 0.01
    maximum_allowed_mean_each_existing_domain_regression: 0.01
  fallback_if_gate_fails: retain_dryland_v3_0.05_paddy_v4_0.05_control
  safety_policy_used_for_selection: false
  spray_deployment_eligible_from_this_protocol: false

control_lock:
  dryland_pack_id: cropcraft_agri_robust_v3_r3
  dryland_pack_manifest_sha256: bc41b9b1a262eb886586d81e6d947c91cf24878c9df5a9962c46edfe6ba633b0
  dryland_pilot_release: cropcraft_agri_robust_pilot_v3
  dryland_pilot_receipt_sha256: cb8d45c27bf45f65814843e3d14c62103968f31fe32ee9091c150e427b7a6e69
  paddy_pack_id: cropcraft_paddy_robust_v4_r5

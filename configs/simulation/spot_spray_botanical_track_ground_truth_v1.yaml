study_id: spot_spray_botanical_track_ground_truth_v1
status: PROTOCOL_ADMISSION_PILOT_SYNTHETIC_ONLY
purpose: >-
  Prove that the pinned CropCraft source can emit botanical source-object IDs,
  persistent tracks, visible instance masks, and occlusion metadata without
  deriving identity from semantic connected components or model predictions.


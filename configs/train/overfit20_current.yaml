experiment: overfit20_convnext_factorized_current
seed: 17
deterministic: true
device: cuda

data_root: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data
manifest: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/processed/manifests/phenobench.csv
output_root: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/runs
cache_root: /media/ankaref/HDD-MNT-500GB_1/tarim_vision_data/cache
commercial_only: false

model:
  architecture: convnext_tiny_fpn
  pretrained: true
  trainable: frozen
  decoder_width: 128
  head: factorized
  num_crop_ids: 32
  known_crop_ids: [0]
  conditioning_dropout: 0.0

training:
  train_split: train
  val_split: train
  limit_train_samples: 20
  limit_val_samples: 20
  epochs: 80
  validate_every: 10
  crop_size: 512
  augment: false
  eval_fixed_crop: true
  batch_size: 4
  eval_batch_size: 1
  gradient_accumulation: 1
  samples_per_epoch: 80
  workers: 4
  amp: true
  learning_rate: 0.001
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0001
  warmup_steps: 25
  gradient_clip: 1.0
  max_crop_spray_risk: 0.005
  weed_thresholds: [0.50, 0.60, 0.70, 0.80, 0.90, 0.95]

loss:
  class_weights: [0.25, 1.5, 1.0]
  dice_weight: 0.5
  crop_safety_weight: 2.0
  crop_safety_tail_fraction: 0.05

safety:
  weed_threshold: 0.70
  crop_threshold: 0.40
  min_confidence: 0.55
  min_margin: 0.15
  max_entropy: 0.85
  crop_dilation_px: 5

      <rect x="574" y="512" width="207" height="110" class="ink"/>
      <path d="M585 622 L585 690 M615 622 L615 690 M741 622 L741 690 M771 622 L771 690" class="muted"/>
      <circle cx="677" cy="540" r="18" class="optical"/>

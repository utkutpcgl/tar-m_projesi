      <text x="677" y="594" text-anchor="middle" class="small">hood internal plan ≥ 600×600 mm</text>
      <text x="677" y="646" text-anchor="middle" class="small">dual skirts 100–150 mm · clearance 0–20 mm</text>
    </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title-exterior desc-exterior" data-view-id="exterior" data-config-sha256="09dd57d852f0517b8716fc5056bc04121e3e6c072521931425f89cd002517dbd" data-architecture-sha256="609e1e7aeea1866d90d3ec5eb2f6a910a481f54edca245ee6ab39f5774b51634">
  <title id="title-exterior">Exterior carrier and one-bay proof architecture</title>
  <desc id="desc-exterior">Source-bound schematic of the frozen one-bay proof architecture. It is pre-real, not physically accepted, and not a fabrication drawing.</desc>
  <metadata>{&quot;architecture_sha256&quot;:&quot;609e1e7aeea1866d90d3ec5eb2f6a910a481f54edca245ee6ab39f5774b51634&quot;,&quot;config_sha256&quot;:&quot;09dd57d852f0517b8716fc5056bc04121e3e6c072521931425f89cd002517dbd&quot;,&quot;contract_id&quot;:&quot;spot_spray_product_architecture_v1&quot;,&quot;source_integrity&quot;:&quot;PASS&quot;,&quot;view_id&quot;:&quot;exterior&quot;}</metadata>
  <defs>
    <pattern id="minor-grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M 25 0 L 0 0 0 25" class="grid" fill="none"/></pattern>
    <marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#087f6d"/></marker>
